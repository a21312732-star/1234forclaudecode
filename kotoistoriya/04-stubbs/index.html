<script>

const SCENES = [
  { id: "s1", s: 0, e: 2.8 }, { id: "s2", s: 2.8, e: 6.2 }, { id: "s3", s: 6.2, e: 12.0 }, { id: "s4", s: 12.0, e: 15.6 },
  { id: "s5", s: 15.6, e: 21.8 }, { id: "s6", s: 21.8, e: 24.4 }, { id: "s7", s: 24.4, e: 27.2 }, { id: "s8", s: 27.2, e: 29.0 }, { id: "s9", s: 29.0, e: 29.3 },
];
const SPEAK = [];
const DROP = ["подписывайся"];
const SHAKES = [], FLASHES = [];
const clockText = (t) => (t >= 2.8 && t < 27.2 ? "КОТОИСТОРИЯ · 1997" : null);
const CAPS = [
  [0.1, "Двадцать лет {y:почётным мэром города} был кот."],
  [2.8, "Тысяча девятьсот девяносто седьмой год, {y:посёлок Талкитна на Аляске.}"],

  [12.0, "Шутка так понравилась, что кот {g:остался главным символом посёлка.}"],

];
const MUSIC = { bpm: 108, root: 55, parts: [[0, 6.2, "pulse", .7], [6.2, 24.4, "drive", .45], [24.4, 27.2, "pad", .6], [27.2, 29.3, "pulse", .8]] };
const E = [
  ["s2", "e2a", "badge b-blu", "c", 220, "🏔 ТАЛКИТНА, АЛЯСКА", 2.9, 99, -2, "font-size:52px"],
  ["s3", "e3a", "badge b-yel", "c", 220, "🗳 ГОЛОСУЕМ В ШУТКУ", 6.3, 99, 2, "font-size:52px"],
  ["s5", "e5a", "badge b-wht", "c", 220, "📸 ТУРИСТЫ СО ВСЕГО МИРА", 18.1, 99, -2, "font-size:46px"],
  ["s7", "m7a", "cmt", 90, 1000, "хочу такого мэра 😻", 24.5, 99, -3], ["s7", "m7b", "cmt", 360, 1100, "а про Наполеона и кроликов? 🐰", 24.9, 99, 2],
];
const GR = 1180;
const STUBBS = { fur: "#e8a14a", fur2: "#c27a2a", coat: "#e8a14a", coat2: "#c27a2a", belly: "#f6e2c4" };
const VOTER1 = { fur: "#9a9a9a", fur2: "#6a6a6a", coat: "#2b4a8a", coat2: "#1a2f5a", hat: "cap", hatC: "#c8242f" }, VOTER2 = { fur: "#3a3a3a", fur2: "#1a1a1a", coat: "#6a8a4a", coat2: "#4a6a2a" };
const sash = (id) => `<g class="ss" transform="translate(0 0)"><path d="M-38 -96 L38 -10" stroke="#c8242f" stroke-width="16"/><text x="-4" y="-46" font-size="16" fill="#fff" transform="rotate(48 -4 -46)" text-anchor="middle">МЭР</text></g>`;
const addSash = (id) => document.querySelector(`#${id} .pr`).insertAdjacentHTML("beforeend", sash(id));
const snowTown = () => `<rect width="${W}" height="${H}" fill="#cfe3f0"/><path d="M0 ${GR - 300} L200 ${GR - 700} L380 ${GR - 420} L600 ${GR - 820} L820 ${GR - 460} L1080 ${GR - 720} V${GR} H0Z" fill="#e8f2fa" stroke="${OL}" stroke-width="6"/>
  ${[[60, 220, 180, "#a8743a"], [320, 260, 220, "#c8242f"], [650, 240, 200, "#3a7bd5"], [900, 200, 170, "#6a8a4a"]].map(([x, w, h, c]) => `<rect x="${x}" y="${GR - h}" width="${w}" height="${h}" fill="${c}" stroke="${OL}" stroke-width="6"/><path d="M${x - 14} ${GR - h} L${x + w / 2} ${GR - h - 70} L${x + w + 14} ${GR - h}Z" fill="#fff" stroke="${OL}" stroke-width="6"/><rect x="${x + w / 2 - 25}" y="${GR - 90}" width="50" height="90" fill="#5a3a22"/>`).join("")}
  <rect y="${GR}" width="${W}" height="${H - GR}" fill="#f4f8fb"/><g id="SN">${Array.from({ length: 40 }, () => `<circle r="6" fill="#fff"/>`).join("")}</g>`;
const snow = (t) => $$("#SN circle").forEach((c, i) => { c.setAttribute("cx", ((hash(i) * W + 30 * Math.sin(t + i)) % W).toFixed(0)); c.setAttribute("cy", ((hash(i + 40) * GR + t * 90) % GR).toFixed(0)); });
function build() {
  buildE(E);
  $("#a1").innerHTML = snowTown() + `<rect x="300" y="${GR - 420}" width="480" height="110" rx="10" fill="#f1ead8" stroke="${OL}" stroke-width="7"/><text x="540" y="${GR - 345}" font-size="64" text-anchor="middle" fill="${OL}">МЭРИЯ</text>` + cat("c1", STUBBS);
  $("#a2").innerHTML = snowTown();
  $("#a3").innerHTML = paperBg() + cat("v1", VOTER1) + cat("v2", VOTER2) + `<g transform="translate(540 ${GR - 60})"><rect x="-150" y="-200" width="300" height="220" fill="#d9a83a" stroke="${OL}" stroke-width="8"/><rect x="-60" y="-210" width="120" height="16" fill="${OL}"/><text y="-60" font-size="56" text-anchor="middle" fill="${OL}">🗳</text></g>` +
    `<g id="bl3">${Array.from({ length: 6 }, (_, i) => `<g class="b"><rect x="-40" y="-26" width="80" height="52" fill="#fff" stroke="${OL}" stroke-width="4"/><text y="10" font-size="30" text-anchor="middle">🐱</text></g>`).join("")}</g>` + cat("k3", STUBBS);
  $("#a4").innerHTML = snowTown() + `<rect x="380" y="${GR - 200}" width="320" height="200" fill="#8a5a32" stroke="${OL}" stroke-width="7"/>` + cat("c4", STUBBS) + cat("v4a", VOTER1) + cat("v4b", VOTER2) + `<g id="cf4"></g>`;
  $("#a5").innerHTML = `<rect width="${W}" height="${H}" fill="#f3e2c0"/><rect y="${GR}" width="${W}" height="${H - GR}" fill="#a8743a"/>${[0, 1, 2].map((i) => `<rect x="60" y="${400 + i * 180}" width="960" height="24" fill="#7a4a2a"/>${Array.from({ length: 10 }, (_, k) => `<rect x="${80 + k * 92}" y="${330 + i * 180}" width="60" height="70" fill="${["#c8242f", "#3a7bd5", "#ffd23f", "#46c46a"][(k + i) % 4]}" stroke="${OL}" stroke-width="4"/>`).join("")}`).join("")}
    <rect x="600" y="${GR - 260}" width="420" height="260" fill="#8a5a32" stroke="${OL}" stroke-width="7"/>` + cat("c5", STUBBS) + cat("t5a", VOTER2) + cat("t5b", { fur: "#f1f1ea", fur2: "#c9c9c0", coat: "#ff8a3d", coat2: "#c86a1a", hat: "cap", hatC: "#46c46a" }) + `<g id="fl5"></g>`;
  $("#a6").innerHTML = paperBg() + cat("c6", STUBBS);
  $("#a7").innerHTML = snowTown() + cat("c7", STUBBS);
  ["c1", "c4", "c5", "c6", "c7"].forEach(addSash);
}
const U = {
  s1(lt, t) { $("#a1").style.transform = ""; snow(t); P("c1", 540, GR - 88 * 2.2, 2.2, { la: 20, ra: 140 + 10 * Math.sin(t * 6), face: "smug" }); wag("c1", t); $("#hook1").style.opacity = 1; $("#hook1").style.transform = `scale(${1 + .03 * Math.sin(t * 7)})`; },
  s2(lt, t) { snow(t); $("#a2").style.transformOrigin = "540px 900px"; $("#a2").style.transform = `scale(${1 + .04 * lt})`; },
  s3(lt, t) { P("v1", 200, GR - 88 * 1.4, 1.4, { la: 20, ra: 100, face: "smug", look: 1 }); P("v2", 880, GR - 88 * 1.4, 1.4, { la: 100, ra: 20, face: "happy", look: -1 }); wag("v1", t); wag("v2", t + 1);
    const k = prog(t, 8.2, 11.8); P("k3", 540, GR - 520 - 88 * .9, .9, { la: 20, ra: 20, face: k > .5 ? "happy" : "calm" }); wag("k3", t, 2);
    $$("#bl3 .b").forEach((b, i) => { const q = clamp((k * 6 - i) / 1); b.setAttribute("transform", `translate(${lerp(i % 2 ? 860 : 220, 540, q)} ${lerp(GR - 300, GR - 160, q) - 160 * Math.sin(q * Math.PI)}) rotate(${q * 360})`); b.setAttribute("opacity", q > 0 && q < 1 ? 1 : 0); }); },
  s4(lt, t) { P("c4", 540, GR - 200 - 88 * 1.7, 1.7, { la: 160, ra: 160, face: "happy" }); wag("c4", t, 2); P("v4a", 200, GR - 88 * 1.3, 1.3, { la: 160, ra: 160, face: "happy" }); P("v4b", 880, GR - 88 * 1.3, 1.3, { la: 160, ra: 160, face: "happy" });
    $("#cf4").innerHTML = Array.from({ length: 24 }, (_, i) => { const q = (t * .6 + hash(i)) % 1; return `<rect x="${(hash(i + 5) * W).toFixed(0)}" y="${(q * 1200).toFixed(0)}" width="16" height="26" fill="${["#ffd23f", "#c8242f", "#3a7bd5"][i % 3]}"/>`; }).join(""); },
  s5(lt, t) { P("c5", 800, GR - 260 - 88 * 1.2, 1.2, { la: 20, ra: 20, face: "smug" }); wag("c5", t); P("t5a", 260, GR - 88 * 1.4, 1.4, { la: 120, ra: 120, face: "happy", look: 1 }); P("t5b", 470, GR - 88 * 1.3, 1.3, { la: 120, ra: 120, face: "happy", look: 1 });
    $("#fl5").innerHTML = Math.sin(t * 5) > .85 ? `<circle cx="320" cy="${GR - 260}" r="70" fill="#fff" opacity=".9"/>` : ""; },
  s6(lt, t) { P("c6", 540, GR + 300 - 88 * 2, 2, { la: 20, ra: 20, face: "smug", blink: 1 }); $("#y6").innerHTML = `${1997 + Math.round(20 * prog(t, 22.0, 24.0))}<small>${t > 24.0 ? "20 ЛЕТ ПОДРЯД!" : "МЭР — КОТ"}</small>`; },
  s7(lt, t) { snow(t); P("c7", 540, GR - 88 * 2, 2, { la: 20, ra: 140, face: "happy" }); wag("c7", t); },
  s8(lt, t) { loopTo(U, t, 27.2, 29.0, "540px 900px"); },
  s9() { holdFirst(U); },
};
const UPD = makeUPD(U);
function SOUND(sfx, add) {
  add(.3, sfx.ding); add(2.9, (a) => sfx.wind(a, 3.2, .4)); for (let i = 0; i < 6; i++) add(8.4 + i * .55, sfx.pop); add(12.1, sfx.ok); add(12.2, (a) => sfx.noise(a, 2.4, "bandpass", 1200, .8, .2, .3));
  for (let t = 18.2; t < 21.6; t += .9) add(t, (a) => sfx.noise(a, .06, "highpass", 3000, 1, .3, .002)); add(24.1, sfx.ding);
  E.forEach((e) => { if (e[6] > 0) add(Math.max(0, e[6] - .02), sfx.pop); }); add(27.25, sfx.whooshDown); add(28.4, (a) => sfx.riser(a, .5));
}
ENGINE.start();
