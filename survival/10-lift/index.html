const MUSIC = { bpm: 104, root: 49, parts: [[0, 10.69, "drive", .7], [10.69, 24.55, "pulse", .6], [24.55, 33.76, "drive", .5], [33.76, 36.95, "pad", .6], [36.95, 39.7, "drive", .7]] };

const E = [

  ["s3", "e3b", "badge b-yel", "c", 320, "1 ТРОС ДЕРЖИТ КАБИНУ", 16.04, 99, 2, "font-size:46px"],

  ["s7", "e7a", "opt", 0, 600, ["😅", "ДА, БЫЛО", "A"], 34.1], ["s7", "e7b", "opt", 0, 770, ["🍀", "НИ РАЗУ", "B"], 34.5],
];
const W = 1080, H = 1920;
const HERO = { coat: "#3a7bd5", coat2: "#24539a", hair: "#3b2a1e", pants: "#2d3a4f" };
// шахта: стены, направляющие, кабина
function shaft(p) {
  return `<rect width="${W}" height="${H}" fill="#2a2d36"/><g id="${p}wl">${Array.from({ length: 14 }, (_, i) => `<rect x="0" y="${i * 160}" width="${W}" height="8" fill="#3a3e4a"/>`).join("")}</g>
    <rect x="150" y="0" width="26" height="${H}" fill="#7a808c"/><rect x="904" y="0" width="26" height="${H}" fill="#7a808c"/>`;
}
const cabin = (id, extra = "") => `<g id="${id}"><rect x="-300" y="-420" width="600" height="560" rx="10" fill="#9aa3b0" stroke="#40454f" stroke-width="10"/>
  <rect x="-270" y="-390" width="540" height="500" fill="#c8ced8"/><rect x="-270" y="80" width="540" height="30" fill="#7a808c"/>${extra}</g>`;
const ropes = (id, n = 6) => `<g id="${id}">${Array.from({ length: n }, (_, i) => `<rect class="rp" x="${-150 + i * 60 - 6}" y="-2000" width="12" height="1580" fill="#c9c9c9"/>`).join("")}</g>`;
function build() {
  E.forEach(([s, id, k, x, y, c, a, o, r, st]) => {
    let html = "", style = (x === "c" ? "left:0;right:0;margin:auto;width:max-content;" : k === "opt" ? "" : `left:${x}px;`) + `top:${y}px;` + (st || "");
    if (k.startsWith("tile")) html = `<span class="em">${c[0]}</span><b>${c[1]}</b>`;
    else if (k === "opt") html = `<span class="em">${c[0]}</span>${c[1]}<span class="k">${c[2]}</span>`;
    else html = c.replace(/(\p{Extended_Pictographic}(?:️|‍\p{Extended_Pictographic})*)/gu, '<span class="em">$1</span>');
    document.getElementById(s).insertAdjacentHTML("beforeend", `<div class="${k} el" id="${id}" style="${style}">${html}</div>`);
  });
  $("#a1").innerHTML = shaft("h1") + `<g id="sp1">${Array.from({ length: 16 }, (_, i) => `<rect x="${60 + i * 64}" width="6" height="220" fill="#fff" opacity=".25"/>`).join("")}</g>` +
    `<g id="cg1" transform="translate(540 900)">${cabin("cb1")}<g id="pp1">${""}</g></g><rect id="fl1" x="0" y="1700" width="${W}" height="220" fill="#1a1c22"/>`;
  $("#cg1 #pp1").outerHTML = person("p1", HERO);
  $("#a2").innerHTML = shaft("h2");
  $("#a3").innerHTML = shaft("h3") + `<g transform="translate(540 1050)">${ropes("rp3")}${cabin("cb3")}</g>`;
  $("#a4").innerHTML = shaft("h4") + `<g id="cg4" transform="translate(540 1000)">${cabin("cb4")}
    <g id="cl4"><rect id="clL" x="-330" y="-300" width="60" height="100" rx="10" fill="#e8c26a" stroke="#5a4010" stroke-width="6"/><rect id="clR" x="270" y="-300" width="60" height="100" rx="10" fill="#e8c26a" stroke="#5a4010" stroke-width="6"/></g></g>
    <g id="spk4">${Array.from({ length: 12 }, () => `<circle r="7" fill="#ffd23f"/>`).join("")}</g>`;
  $("#a5").innerHTML = `<rect width="${W}" height="${H}" fill="#c8ced8"/><rect x="700" y="420" width="240" height="640" rx="20" fill="#7a808c" stroke="#40454f" stroke-width="8"/>
    ${[0, 1, 2, 3, 4, 5].map((i) => `<circle cx="${770 + (i % 2) * 100}" cy="${520 + Math.floor(i / 2) * 110}" r="34" fill="#dfe3ea" stroke="#40454f" stroke-width="5"/><text x="${770 + (i % 2) * 100}" y="${534 + Math.floor(i / 2) * 110}" font-size="36" text-anchor="middle" fill="#333">${i + 1}</text>`).join("")}
    <circle id="bell5" cx="820" cy="900" r="62" fill="#ffd23f" stroke="#7a5a10" stroke-width="7"/><text x="820" y="932" font-size="80" text-anchor="middle" font-family="Noto Color Emoji">🔔</text>` + person("p5", HERO);
}
const sb = {}; E.forEach((e) => (sb[e[0]] = sb[e[0]] || []).push(e));
const elUpd = (sid, t) => (sb[sid] || []).forEach(([, id, , , , , a, o, r]) => { const el = document.getElementById(id); pop(el, t, a, r || 0); if (t < a) el.style.opacity = 0; if (o && o !== 99) hide(el, t, o); });
const U = {
  s1(lt, t) {
    $("#a1").style.transform = "";
    // кабина падает (стены и полосы скорости бегут вверх), человек в прыжке, пол шахты приближается
    $("#h1wl").setAttribute("transform", `translate(0 ${-((t * 2600) % 160)})`);
    $$("#sp1 rect").forEach((r, i) => r.setAttribute("y", ((hash(i + 1) * H - t * 3400) % H + H) % H));
    const jump = Math.sin(Math.min(1, t / 3.8) * Math.PI);
    at("p1", 0, 60 - 130 * jump, 1.25); setPose("p1", { la: 160, ra: 160, ll: 30, rl: 30, face: "panic", sq: 1 + .05 * jump });
    $("#fl1").setAttribute("y", lerp(1920, 1500, prog(t, 1.6, 3.9)));
    const hk = $("#hook1"); hk.style.opacity = 1 - prog(t, 2.5, 2.8); hk.style.transform = `scale(${1 + .03 * Math.sin(t * 7)})`;
  },
  s2(lt, t) {
    const st = $("#st2"), sp = prog(t, 3.9, 4.1); st.style.opacity = sp; st.style.transform = `rotate(-8deg) scale(${lerp(2.5, 1, easeOut(sp))})`;
    show($("#b2a"), t, 6.05); show($("#b2b"), t, 7.74);
    $("#f2a").style.width = 100 * easeOut(prog(t, 6.1, 6.9)) + "%"; $("#f2b").style.width = 6 * easeOut(prog(t, 7.8, 8.3)) + "%";
    if (t < 6.05) $("#b2a").style.opacity = 0; if (t < 7.74) $("#b2b").style.opacity = 0;
  },
  s3(lt, t) {
    const rp = $$("#rp3 .rp"), cut = prog(t, 16.6, 18.0);
    rp.forEach((r, i) => { const hl = t > 14.16 && t < 16.04 ? (Math.floor((t - 14.16) * 4) % 6 === i ? 1 : 0) : 0; r.setAttribute("fill", hl ? "#ffd23f" : i === 2 && t > 16.04 ? "#4dff8a" : "#c9c9c9");
      r.setAttribute("opacity", i !== 2 && cut > i / 6 ? .12 : 1); });
  },
  s4(lt, t) {
    const fall = t < 20.41 ? easeIn(prog(t, 18.9, 20.41)) * 260 : 260;
    $("#cg4").setAttribute("transform", `translate(${540 + (t > 20.41 && t < 20.8 ? 6 * Math.sin(t * 90) : 0)} ${740 + fall})`);
    const grab = prog(t, 20.41, 20.6); $("#clL").setAttribute("x", lerp(-330, -400, grab)); $("#clR").setAttribute("x", lerp(270, 340, grab));
    $$("#spk4 circle").forEach((c, i) => { const k = ((t - 20.41) * 1.5 + i / 12) % 1, sd = i % 2 ? 1 : -1;

  add(3.9, sfx.boom); add(3.9, sfx.hit); add(6.1, sfx.whoosh); add(7.8, sfx.pop);
