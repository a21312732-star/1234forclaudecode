const W = 1080, H = 1920, FL = 1150;
const HERO = { coat: "#3a7bd5", coat2: "#24539a", hat: "#ff5a5a", hat2: "#fff", pants: "#2d3a4f", gloves: "#ff5a5a" };
// крупный план кисти: пальцы белеют (k 0..1)
function hand(id) {

    ${[-150, -55, 40, 135].map((x, i) => `<rect class="fg" x="${x}" y="${-330 + (i === 0 || i === 3 ? 60 : 0)}" width="80" height="${300 - (i === 0 || i === 3 ? 60 : 0)}" rx="40" fill="#f4c7a1" stroke="#a87a5a" stroke-width="10"/>`).join("")}
    <rect x="200" y="20" width="90" height="230" rx="45" fill="#f4c7a1" stroke="#a87a5a" stroke-width="10" transform="rotate(-35 245 135)" class="fg"/></g>`;
}
const snowBg = (p) => `<rect width="${W}" height="${H}" fill="#9fc6e8"/><rect y="${FL}" width="${W}" height="${H - FL}" fill="#eef4fa"/><g id="${p}sn">${Array.from({ length: 80 }, (_, i) => `<circle r="${3 + 5 * hash(i + 1)}" fill="#fff"/>`).join("")}</g>`;
function updSn(id, t) { $$(`#${id} circle`).forEach((c, i) => { c.setAttribute("cx", ((hash(i + 5) * 1180 - t * 60) % 1180 + 1180) % 1180 - 50); c.setAttribute("cy", ((hash(i + 3) * H + t * (120 + 160 * hash(i + 7))) % H)); }); }
function build() {
  E.forEach(([s, id, k, x, y, c, a, o, r, st]) => {

    if (k.startsWith("tile")) html = `<span class="em">${c[0]}</span><b>${c[1]}</b>`;
    else if (k === "opt") html = `<span class="em">${c[0]}</span>${c[1]}<span class="k">${c[2]}</span>`;
    else html = c.replace(/(\p{Extended_Pictographic}(?:️|‍\p{Extended_Pictographic})*)/gu, '<span class="em">$1</span>');
    document.getElementById(s).insertAdjacentHTML("beforeend", `<div class="${k} el" id="${id}" style="${style}">${html}</div>`);
  });
  $("#a1").innerHTML = snowBg("b1") + `<g transform="translate(540 820)">${hand("h1")}</g>`;
  $("#a2").innerHTML = snowBg("b2") + person("p2", { ...HERO, gloves: "#f4f4f4" }) + `<g id="sb2"><circle r="44" fill="#fff" stroke="#bcd" stroke-width="5"/></g>`;
  $("#a3").innerHTML = `<rect width="${W}" height="${H}" fill="#2a2440"/><g transform="translate(540 900)">${hand("h3")}<g id="sc3" opacity="0">${[0, 1, 2, 3].map((i) => `<path d="M${-150 + i * 95} -250 l40 120" stroke="#c0392b" stroke-width="7"/>`).join("")}</g>
    <g id="mb3">${Array.from({ length: 8 }, () => `<g class="m"><circle r="16" fill="#6ad16a" stroke="#2a6a2a" stroke-width="4"/><circle cx="-5" cy="-4" r="3"/><circle cx="5" cy="-4" r="3"/></g>`).join("")}</g></g>`;
  $("#a5").innerHTML = `<rect width="${W}" height="${H}" fill="#f2e2c8"/><rect y="${FL}" width="${W}" height="${H - FL}" fill="#c9a87a"/>` + person("p5", HERO) +

    <g id="bw5" opacity="0" transform="translate(760 ${FL - 70})"><path d="M-150 -60 H150 L120 70 H-120Z" fill="#9aa3b0" stroke="#333" stroke-width="7"/><ellipse cy="-60" rx="150" ry="28" fill="#7ad0ff"/>
      <path d="M-60 -110 q15 -30 0 -60 M0 -110 q15 -30 0 -60 M60 -110 q15 -30 0 -60" stroke="#fff" stroke-width="6" fill="none" opacity=".7"/></g>`;
  $("#a7").innerHTML = `<rect width="${W}" height="${H}" fill="#2a2440"/><g transform="translate(540 820)">${hand("h7")}<g id="bl7" opacity="0">${[[-110, -250], [-15, -280], [80, -250]].map(([x, y]) => `<ellipse cx="${x}" cy="${y}" rx="30" ry="24" fill="#fff8e0" stroke="#d0b070" stroke-width="5"/>`).join("")}</g>

const sb = {}; E.forEach((e) => (sb[e[0]] = sb[e[0]] || []).push(e));
const elUpd = (sid, t) => (sb[sid] || []).forEach(([, id, , , , , a, o, r]) => { const el = document.getElementById(id); pop(el, t, a, r || 0); if (t < a) el.style.opacity = 0; if (o && o !== 99) hide(el, t, o); });
const P = (id, x, y, s, pose, r = 0, o = 1) => { at(id, x, y, s, o, r); setPose(id, pose); };
const hip = (s) => FL - 88 * s;
const whiten = (id, k) => $$(`#${id} .fg`).forEach((f, i) => f.setAttribute("fill", mixC("#f4c7a1", "#f2f4f8", clamp(k * 1.4 - i * .1))));
const mixC = (a, b, k) => { const h = (s) => [1, 3, 5].map((i) => parseInt(s.slice(i, i + 2), 16)); const A = h(a), B = h(b); return "#" + A.map((v, i) => Math.round(v + (B[i] - v) * k).toString(16).padStart(2, "0")).join(""); };
const U = {

  add(0, (a) => sfx.wind(a, 14.8, 1)); for (let t = .2; t < 4; t += .07) add(t, (a) => sfx.noise(a, .02, "highpass", 2500, 1, .06, .002)); // дрожь
  for (let t = 8.9; t < 11; t += .14) add(t, (a) => sfx.noise(a, .1, "bandpass", 1500, 1, .2, .01)); add(9.6, sfx.boom);
