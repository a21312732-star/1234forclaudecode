    <rect y="${FL - 18}" width="${W}" height="20" fill="#2a2234"/>
    ${opt.bed ? `<g><rect x="110" y="${FL - 150}" width="470" height="110" rx="20" fill="#8a6a4a" stroke="#3a2412" stroke-width="8"/><rect x="120" y="${FL - 190}" width="450" height="60" rx="24" fill="#e9e4f2"/>

}
const smoke = (id) => `<path id="${id}" fill="#7a7e8a" opacity=".88"/>`;
function updSmoke(id, t, depth) { // волнистый нижний край дыма на глубине depth от потолка
  let d = `M0 0 H${W} V${CEIL + depth}`; for (let x = W; x >= 0; x -= 60) d += ` L${x} ${CEIL + depth + 22 * Math.sin(x * .02 + t * 2)}`; d += " Z";
  $("#" + id).setAttribute("d", d);
}
const blanket = (id) => `<path id="${id}" d="M260 ${FL - 200} H570 V${FL - 120} H260Z" fill="#c0392b" stroke="#7a1f14" stroke-width="6"/>`;
function build() {

    if (k.startsWith("tile")) html = `<span class="em">${c[0]}</span><b>${c[1]}</b>`;
    else if (k === "opt") html = `<span class="em">${c[0]}</span>${c[1]}<span class="k">${c[2]}</span>`;

    <rect id="gap3" x="240" y="1190" width="620" height="18" fill="#ff7a1a" opacity="0" style="filter:drop-shadow(0 0 20px #ff7a1a)"/>
    <g id="hand3"><rect x="-300" y="-40" width="300" height="80" rx="40" fill="${HERO_P.coat}" stroke="#2a2a55" stroke-width="6"/><ellipse cx="20" cy="0" rx="60" ry="46" fill="#f4c7a1" stroke="#7a5a3a" stroke-width="5"/></g>`;
  $("#a4").innerHTML = `<rect width="${W}" height="${H}" fill="#3d4256"/><rect y="${FL}" width="${W}" height="${H - FL}" fill="#4a4f60"/>

const sb = {}; E.forEach((e) => (sb[e[0]] = sb[e[0]] || []).push(e));
const elUpd = (sid, t) => (sb[sid] || []).forEach(([, id, , , , , a, o, r]) => { const el = document.getElementById(id); pop(el, t, a, r || 0); if (t < a) el.style.opacity = 0; if (o && o !== 99) hide(el, t, o); });

    const cl = easeInOut(prog(t, 18.8, 19.6)); $("#dr4").setAttribute("transform", `translate(${60 + 210 * (1 - cl) * 0} 0)`);
    $("#dr4").setAttribute("opacity", cl); $("#dr4").setAttribute("transform", `translate(${(1 - cl) * 165} 0) scale(${Math.max(.05, cl)} 1)`);
