  const leg = (cls, x) => `<rect class="${cls}" x="${x - 26}" y="-110" width="56" height="112" rx="22" fill="#5a3620" stroke="#000" stroke-width="7"/>`;

    <path d="M-170 -110 Q-190 -300 -20 -310 Q120 -330 200 -260 Q260 -200 230 -110 Z" fill="#6b4226" stroke="#000" stroke-width="8"/>
    <path d="M-60 -300 Q20 -350 110 -300" fill="none" stroke="#7d5232" stroke-width="10"/>
    ${leg("l2", -60)}${leg("l4", 190)}
    <g class="hd" transform="translate(-190 -240)"><circle cx="-10" cy="-70" r="26" fill="#6b4226" stroke="#000" stroke-width="7"/><circle cx="60" cy="-70" r="26" fill="#6b4226" stroke="#000" stroke-width="7"/>

  g.querySelector(".mo").setAttribute("d", roar ? `M-100 34 Q-60 ${70 + 30 * roar} -24 40 Z` : "M-90 40 Q-60 60 -30 46");
}

const hip = (s) => FL - 88 * s;

  s1(lt, t) {
