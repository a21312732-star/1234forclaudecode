<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Если вдруг #12 — Не пить воду</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../survival/engine.css"><link rel="stylesheet" href="../../survival/choice.css">
<style>#stage{background:#f2d8a8}
#clock{background:#6c3ce0;color:#fff;box-shadow:0 6px 0 #3a1a8a}
.day{position:absolute;left:0;right:0;top:250px;text-align:center;font:900 120px var(--head);color:#c8242f;z-index:6;text-shadow:6px 6px 0 #000}</style>
</head>
<body>
<div id="wrap"><div id="stage"><div id="cam">
  <div class="scene" id="s1"><svg class="full" width="1080" height="1920" viewBox="0 0 1080 1920" id="a1"></svg>
    <div class="hook" id="hook1" style="font-size:88px">СОВСЕМ<br><b>НЕ ПИТЬ ВОДУ?</b> 💧</div></div>
  <div class="scene" id="s2"><svg class="full" width="1080" height="1920" viewBox="0 0 1080 1920" id="a2"></svg><div class="day" id="d2">ЧАС 6</div></div>
  <div class="scene" id="s3"><svg class="full" width="1080" height="1920" viewBox="0 0 1080 1920" id="a3"></svg><div class="day">ДЕНЬ 1</div></div>
  <div class="scene" id="s4"><svg class="full" width="1080" height="1920" viewBox="0 0 1080 1920" id="a4"></svg><div class="day">ДЕНЬ 2</div></div>
  <div class="scene" id="s5"><svg class="full" width="1080" height="1920" viewBox="0 0 1080 1920" id="a5"></svg></div>
  <div class="scene" id="s6"><svg class="full" width="1080" height="1920" viewBox="0 0 1080 1920" id="a6"></svg></div>
  <div class="scene" id="s7"></div>
  <div class="scene" id="s8"></div>
</div></div></div>
<script src="../../survival/engine.js"></script>
<script src="../../survival/choice.js"></script>
<script src="../common.js"></script>
<script>
"use strict";
const DUR = 28.3;
// Растяжка таймлайна под озвучку: пары [время сценария, время видео]. Строку генерирует tools/make-voice.py
const WARP = [[0, 0.00], [0.1, 0.10], [2.4, 1.96], [5.4, 4.75], [7.8, 7.21], [10.4, 10.26], [13.8, 13.00], [18.2, 16.68], [21.4, 18.97], [22.6, 20.78], [25, 22.68], [26.2, 23.71], [28, 24.61], [28.3, 24.91]];
const SCENES = [
  { id: "s1", s: 0, e: 2.4 }, { id: "s2", s: 2.4, e: 5.4 }, { id: "s3", s: 5.4, e: 10.4 }, { id: "s4", s: 10.4, e: 13.8 },
  { id: "s5", s: 13.8, e: 22.6 }, { id: "s6", s: 22.6, e: 25.0 }, { id: "s7", s: 25.0, e: 28.0 }, { id: "s8", s: 28.0, e: 28.3 },
];
const SPEAK = [];
const DROP = ["подписывайся"];
const SHAKES = [], FLASHES = [];
const clockText = (t) => (t >= 2.4 && t < 25.0 ? "ЕСЛИ ВДРУГ · #12" : null);
const CAPS = [
  [0.1, "Что будет, если {y:совсем не пить воду?}"],
  [2.4, "Уже через несколько часов захочется пить,"], [4.18, "а голова станет тяжёлой."],
  [5.4, "Через сутки {r:моча станет тёмной,} а кожа сухой."], [7.8, "Сердце начнёт биться чаще, {r:ведь крови стало меньше.}"],
  [10.4, "На второй день начнутся {r:головокружение и путаница в мыслях.}"],
  [13.8, "Без воды человек обычно выживает {r:всего около трёх дней,}"], [16.93, "а в жару ещё меньше."],
  [18.2, "Без еды можно продержаться неделями,"], [20.28, "{r:а без воды — нет.}"],
  [21.4, "{g:Так что пей, когда хочется пить.}"],
  [22.6, "Пиши в комменты, {y:что проверить дальше.}"], [25, "А пока представь:"], [26.2, "{y:что будет, если...}"], [28, ""]
];
const MUSIC = { bpm: 96, root: 52, parts: [[0, 10.4, "pulse", .7], [10.4, 22.6, "pad", .7], [22.6, 25.0, "pulse", .5], [25.0, 28.3, "pulse", .8]] };
const E = [
  ["s3", "e3a", "badge b-red", "c", 1060, "❤ ПУЛЬС ЧАЩЕ", 7.9, 99, -2, "font-size:56px"],
  ["s4", "e4a", "badge b-red", "c", 1060, "😵 ГОЛОВОКРУЖЕНИЕ", 10.5, 99, 2, "font-size:52px"],
  ["s5", "e5a", "badge b-red", "c", 220, "💧 БЕЗ ВОДЫ ≈ 3 ДНЯ", 13.9, 99, -2, "font-size:54px"], ["s5", "e5b", "badge b-grn", "c", 340, "🍞 БЕЗ ЕДЫ — НЕДЕЛИ", 18.3, 99, 2, "font-size:50px"],
  ["s6", "m6a", "cmt", 90, 1000, "а если не есть сахар месяц? 🍭", 22.7, 99, -3], ["s6", "m6b", "cmt", 330, 1100, "а если пить только газировку? 🥤", 23.1, 99, 2],
];
const HERO = { coat: "#ff8a3d", coat2: "#d96a1f", hair: "#3b2a1e", pants: "#3b3f58" };
const room = () => `<rect width="${W}" height="${H}" fill="#f2d8a8"/><circle cx="900" cy="560" r="90" fill="#ffd23f"/><rect y="${GR}" width="${W}" height="${H - GR}" fill="#d9b070"/>`;
const tired = (t, k) => ({ la: 20 + 5 * Math.sin(t * 2), ra: 20, face: k > .5 ? "worried" : "calm", tilt: 10 * k * Math.sin(t * 1.3), sq: 1 - .05 * k });
const hip = (s) => GR - 88 * s;
function build() {
  buildE(E);
  $("#a1").innerHTML = room() + person("p1", HERO) + `<g transform="translate(800 ${GR - 30})"><rect x="-50" y="-260" width="100" height="260" rx="30" fill="#bfe3f5" opacity=".6" stroke="#111" stroke-width="7"/><path d="M-60 -280 L60 -40 M60 -280 L-60 -40" stroke="#ff3b47" stroke-width="20" stroke-linecap="round"/></g>`;
  $("#a2").innerHTML = room() + person("p2", HERO);
  $("#a3").innerHTML = room() + person("p3", HERO) + `<g id="hb3" transform="translate(780 700)"><path d="M0 40 C-80 -40 -60 -110 0 -70 C60 -110 80 -40 0 40Z" fill="#ff3b47" stroke="#111" stroke-width="8"/></g>`;
  $("#a4").innerHTML = room() + person("p4", HERO) + `<g id="st4" font-size="70" fill="#ffd23f" stroke="#111" stroke-width="3"></g>`;
  $("#a5").innerHTML = `<rect width="${W}" height="${H}" fill="#fff4dc"/><g transform="translate(300 900)"><rect x="-90" y="-260" width="180" height="420" rx="40" fill="#bfe3f5" stroke="#111" stroke-width="10"/><rect id="wl5" x="-80" y="-250" width="160" height="400" rx="34" fill="#3aa0ff"/><text y="240" font-size="56" text-anchor="middle">3 дня</text></g>
    <g transform="translate(780 900)"><rect x="-90" y="-260" width="180" height="420" rx="40" fill="#f3e2c0" stroke="#111" stroke-width="10"/><rect x="-80" y="-250" width="160" height="400" rx="34" fill="#e8a14a"/><text y="240" font-size="56" text-anchor="middle">недели</text></g>`;
  $("#a6").innerHTML = room() + person("p6", HERO) + `<g transform="translate(720 ${GR - 300})"><rect x="-40" y="0" width="80" height="110" rx="10" fill="#bfe3f5" opacity=".6" stroke="#111" stroke-width="6"/><rect x="-34" y="40" width="68" height="64" fill="#3aa0ff"/></g>`;
}
const U = {
  s1(lt, t) { $("#a1").style.transform = ""; P("p1", 400, hip(1.8), 1.8, { la: -100, ra: 20, face: "worried" }); $("#hook1").style.opacity = 1; $("#hook1").style.transform = `scale(${1 + .03 * Math.sin(t * 7)})`; },
  s2(lt, t) { P("p2", 540, hip(1.7), 1.7, { ...tired(t, .2), la: -100 }); $("#d2").textContent = `ЧАС ${Math.max(1, Math.round(6 * prog(t, 2.5, 4.6)))}`; },
  s3(lt, t) { P("p3", 420, hip(1.7), 1.7, tired(t, .5)); $("#hb3").setAttribute("transform", `translate(780 700) scale(${1 + .15 * Math.max(0, Math.sin(t * 9))})`); },
  s4(lt, t) { P("p4", 540 + 30 * Math.sin(t * 1.5), hip(1.7), 1.7, tired(t, 1), 8 * Math.sin(t * 1.5)); $("#st4").innerHTML = [0, 1, 2].map((i) => { const a = t * 3 + i * 2.1; return `<text x="${540 + 90 * Math.cos(a)}" y="${hip(1.7) - 300 + 30 * Math.sin(a)}">★</text>`; }).join(""); },
  s5(lt, t) { const k = prog(t, 14.0, 21.0); $("#wl5").setAttribute("height", 400 * (1 - k)); $("#wl5").setAttribute("y", -250 + 400 * k); },
  s6(lt, t) { P("p6", 540, hip(1.8), 1.8, { la: 20, ra: 130, face: "happy" }); },
  s7(lt, t) { loopTo(U, t, 25.0, 28.0); },
  s8() { holdFirst(U); },
};
const UPD = makeUPD(U);
function SOUND(sfx, add) {
  add(.3, sfx.no); for (let t = 7.9; t < 10.4; t += .4) add(t, (a) => sfx.heart(a, .8)); add(10.5, (a) => sfx.noise(a, 3, "bandpass", 900, 2, .1, 1)); add(14.0, sfx.no); add(18.3, sfx.ding); add(21.5, sfx.ok);
  E.forEach((e) => { if (e[6] > 0) add(Math.max(0, e[6] - .02), sfx.pop); }); add(25.05, sfx.whooshDown); add(27.4, (a) => sfx.riser(a, .5));
}
ENGINE.start();
</script>
</body>
</html>
