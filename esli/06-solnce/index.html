  ["s6", "m6a", "cmt", 90, 1000, "а если Земля станет плоской? 🥞", 27.7, 99, -3], ["s6", "m6b", "cmt", 330, 1100, "а если исчезнет гравитация? 🪐", 28.1, 99, 2],

  s2(lt, t) {
    setEarth("ea2", t * 60, "calm"); const k = prog(t, 3.8, 8.6); $("#ph2").setAttribute("cx", lerp(340, 810, k)); $("#ph2").setAttribute("cy", 960);
    const s = Math.round(480 * (1 - k)); $("#t2").innerHTML = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}<small>МИНУТ ЛЕТИТ СВЕТ</small>`; $("#sn2").setAttribute("opacity", t > 3.8 ? .25 : 1);
  },
  s3(lt, t) { setEarth("ea3", t * 60, t > 9.4 ? "shock" : "calm"); $("#dk3").setAttribute("opacity", .55 * prog(t, 9.0, 9.6)); $("#mn3").setAttribute("opacity", 1 - .85 * prog(t, 10.6, 11.6)); },
  s4(lt, t) {
    $("#th4").setAttribute("height", 200 * (1 - .8 * prog(t, 14.2, 16.5))); $("#th4").setAttribute("y", -180 + 200 * .8 * prog(t, 14.2, 16.5));
    $$("#a4 .lf").forEach((l) => l.setAttribute("fill", t > 17.0 ? "#8a7a5a" : "#46c46a")); $$("#a4 .lf").forEach((l) => l.setAttribute("r", t > 17.0 ? lerp(70, 30, prog(t, 17, 19)) : 70));
    $("#sn4").innerHTML = Array.from({ length: 30 }, (_, i) => `<circle cx="${(hash(i) * W).toFixed(0)}" cy="${((t * 120 + hash(i + 9) * 1200) % 1200).toFixed(0)}" r="6" fill="#fff"/>`).join("");
  },
  s5(lt, t) {
    const h = 160 * prog(t, 21.0, 23.4); $("#ic5").setAttribute("height", h);

  s6(lt, t) { setEarth("ea6", t * 60, "calm"); },
  s7(lt, t) { loopTo(U, t, 30.0, 33.0); },
  s8() { holdFirst(U); },

function SOUND(sfx, add) {

  E.forEach((e) => { if (e[6] > 0) add(Math.max(0, e[6] - .02), sfx.pop); }); add(30.05, sfx.whooshDown); add(32.4, (a) => sfx.riser(a, .5));
}
