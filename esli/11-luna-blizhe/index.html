const WARP = [[0, 0.00], [0.1, 0.10], [2.6, 2.32], [4.2, 3.65], [6.6, 5.21], [8.6, 6.89], [12, 10.23], [14.8, 12.63], [19.4, 17.76], [22, 20.20], [24.8, 22.27], [27.2, 24.21], [28.4, 25.03], [30.2, 25.93], [30.5, 26.23]];

  { id: "s5", s: 19.4, e: 24.8 }, { id: "s6", s: 24.8, e: 27.2 }, { id: "s7", s: 27.2, e: 30.2 }, { id: "s8", s: 30.2, e: 30.5 },
];
const SPEAK = [];
const DROP = ["подписывайся"];
const SHAKES = [16.4], FLASHES = [];
const clockText = (t) => (t >= 2.6 && t < 27.2 ? "ЕСЛИ ВДРУГ · #11" : null);
const CAPS = [
  [0.1, "Что будет, если {y:Луна окажется в два раза ближе?}"],
  [2.6, "На небе она станет огромной —"], [4.2, "{y:в четыре раза больше,} чем сейчас."],

];
const MUSIC = { bpm: 96, root: 49, parts: [[0, 6.6, "pad", .7], [6.6, 24.8, "drive", .45], [24.8, 27.2, "pad", .6], [27.2, 30.5, "pulse", .8]] };
const E = [

  ["s3", "e3a", "badge b-blu", "c", 220, "🌊 1 М → 8 М", 10.5, 99, 2, "font-size:64px"],

const moon = (id) => `<g id="${id}"><circle r="110" fill="#eeece2" stroke="#111" stroke-width="10"/><circle cx="-30" cy="-30" r="22" fill="#cfccbf"/><circle cx="40" cy="20" r="16" fill="#cfccbf"/><circle cx="-10" cy="50" r="12" fill="#cfccbf"/><circle r="200" fill="#eeece2" opacity=".12"/></g>`;
const nightCity = (sky = "#1b1640") => `<rect width="${W}" height="${H}" fill="${sky}"/>${Array.from({ length: 50 }, (_, i) => `<circle cx="${(hash(i) * W).toFixed(0)}" cy="${(hash(i + 50) * 800).toFixed(0)}" r="2.5" fill="#fff" opacity=".6"/>`).join("")}`;
const skyline = (y = GR) => `${[[0, 180, 420], [200, 160, 540], [380, 200, 360], [600, 150, 600], [770, 200, 440], [960, 140, 500]].map(([x, w, h]) => `<rect x="${x}" y="${y - h}" width="${w}" height="${h}" fill="#2a2a44" stroke="#111" stroke-width="5"/>${Array.from({ length: Math.floor(h / 90) }, (_, r) => `<rect x="${x + 24}" y="${y - h + 30 + r * 90}" width="${w - 48}" height="30" fill="#ffd27a" opacity="${hash(x + r) > .4 ? .9 : .15}"/>`).join("")}`).join("")}`;
function build() {
  buildE(E);
  $("#a1").innerHTML = nightCity() + `<g id="mn1g">${moon("mn1")}</g>` + skyline() + `<rect y="${GR}" width="${W}" height="${H - GR}" fill="#14182a"/>`;
  $("#a2").innerHTML = nightCity() + `<g id="mg2">${moon("mn2a")}</g>` + `<g transform="translate(860 280) scale(.5)">${moon("mn2b")}</g><text x="860" y="400" font-size="40" text-anchor="middle" fill="#fff">сейчас</text>` + skyline() + `<rect y="${GR}" width="${W}" height="${H - GR}" fill="#14182a"/>`;
  $("#a3").innerHTML = `<rect width="${W}" height="${H}" fill="#8cc8ee"/>${skyline(GR + 80).replace(/#2a2a44/g, "#e8a87c").replace(/#ffd27a/g, "#bfe3f5")}<path id="sea3" fill="#2b7bbf" stroke="#111" stroke-width="8"/>
    <g id="ml3"><rect x="40" y="${GR - 700}" width="40" height="760" fill="#fff" stroke="#111" stroke-width="5"/>${Array.from({ length: 9 }, (_, i) => `<path d="M40 ${GR + 60 - i * 90} h${i % 4 === 0 ? 60 : 30}" stroke="#111" stroke-width="5"/><text x="110" y="${GR + 72 - i * 90}" font-size="34" fill="#111">${i}м</text>`).join("")}</g>`;
  $("#a4").innerHTML = space() + `<g transform="translate(540 1150)">${earth("ea4", 360)}</g><g transform="translate(540 420)">${moon("mn4")}</g>` + `<g id="vl4"></g>`;
  $("#a5").innerHTML = nightCity("#3a4a7a") + `<g transform="translate(540 520) scale(2.4)">${moon("mn5")}</g>` + skyline() + `<rect y="${GR}" width="${W}" height="${H - GR}" fill="#2a3450"/>`;
  $("#a6").innerHTML = space() + `<g transform="translate(540 1150)">${earth("ea6", 360)}</g><g transform="translate(540 420) scale(1.4)">${moon("mn6")}</g>`;
}
const U = {
  s1(lt, t) { $("#a1").style.transform = ""; const k = easeInOut(prog(t, .3, 2.4)); $("#mn1g").setAttribute("transform", `translate(${lerp(820, 540, k)} ${lerp(300, 560, k)}) scale(${lerp(.6, 2.2, k)})`); $("#hook1").style.opacity = 1; $("#hook1").style.transform = `scale(${1 + .03 * Math.sin(t * 7)})`; },
  s2(lt, t) { const k = easeOut(prog(t, 2.8, 4.6)); $("#mg2").setAttribute("transform", `translate(460 620) scale(${lerp(.5, 2.4, k)})`); },
  s3(lt, t) { const k = prog(t, 6.6, 14.6), lvl = GR + 70 - 90 * 8 * (.5 - .5 * Math.cos(k * Math.PI * 2.2)); let d = `M0 ${H} L0 ${lvl}`; for (let x = 0; x <= W; x += 40) d += ` L${x} ${(lvl + 14 * Math.sin(x / 60 + t * 3)).toFixed(0)}`; $("#sea3").setAttribute("d", d + ` L${W} ${H}Z`); },
  s4(lt, t) { setEarth("ea4", t * 40, t > 16.4 ? "shock" : "calm"); $("#vl4").innerHTML = t > 16.4 ? [[-.6, 1], [.4, 1.3], [.9, .7]].map(([a, s], i) => { const x = 540 + Math.sin(a) * 360, y = 1150 - Math.cos(a) * 360; return `<g transform="translate(${x} ${y}) rotate(${a * 57}) scale(${s})"><path d="M-40 0 L-14 -60 L14 -60 L40 0Z" fill="#7a4a2a" stroke="#111" stroke-width="5"/>${[0, 1, 2].map((j) => { const q = (t * .8 + j / 3 + i) % 1; return `<circle cy="${-70 - q * 120}" r="${10 + 20 * q}" fill="${j % 2 ? "#ff6a1a" : "#888"}" opacity="${1 - q}"/>`; }).join("")}</g>`; }).join("") : ""; },
  s5(lt, t) { $("#a5").style.transformOrigin = "540px 900px"; $("#a5").style.transform = `scale(${1 + .03 * lt})`; },
  s6(lt, t) { setEarth("ea6", t * 40, "calm"); },
  s7(lt, t) { loopTo(U, t, 27.2, 30.2); },
  s8() { holdFirst(U); },
};
const UPD = makeUPD(U);
function SOUND(sfx, add) {
  add(.3, (a) => sfx.riser(a, 2)); add(4.3, sfx.ding); add(6.7, (a) => sfx.noise(a, 8, "lowpass", 400, 1, .3, 2)); add(10.5, sfx.splash); add(12.1, sfx.splash);
  add(16.4, sfx.boom); add(16.6, (a) => sfx.noise(a, 2.6, "lowpass", 100, 1, .4, .3)); add(19.5, (a) => sfx.osc("sine", 660, a, .3, .05, 2));
  E.forEach((e) => { if (e[6] > 0) add(Math.max(0, e[6] - .02), sfx.pop); }); add(27.25, sfx.whooshDown); add(29.6, (a) => sfx.riser(a, .5));
}
ENGINE.start();
