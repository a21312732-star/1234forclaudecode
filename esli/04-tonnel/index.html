const MUSIC = { bpm: 120, root: 55, parts: [[0, 11.2, "pulse", .8], [11.2, 26.6, "drive", .5], [26.6, 30.4, "pad", .6], [30.4, 33.7, "pulse", .8]] };
const E = [

  ["s5", "e5a", "badge b-yel", "c", 1060, "⏱ ≈ 40 МИНУТ", 19.9, 99, -2, "font-size:60px"],

  ["s7", "m7a", "cmt", 90, 980, "а если упасть в чёрную дыру? 🕳", 28.3, 99, -3], ["s7", "m7b", "cmt", 300, 1080, "а если Земля станет плоской? 🥞", 28.7, 99, 2],
];
const HERO = { coat: "#ff8a3d", coat2: "#d96a1f", hair: "#3b2a1e", pants: "#3b3f58" };
const CX = 540, CY = 1000, R = 560;
// разрез Земли с тоннелем
const section = (id) => `<g id="${id}"><circle cx="${CX}" cy="${CY}" r="${R + 30}" fill="#3aa0ff" stroke="#111" stroke-width="12"/><circle cx="${CX}" cy="${CY}" r="${R}" fill="#8a5a32" stroke="#111" stroke-width="8"/>

const hipY = (y, s) => y;
function build() {

  $("#a4").innerHTML = space() + section("x4") + person("p4", HERO);
  $("#a5").innerHTML = `<rect width="${W}" height="${H}" fill="#2b2350"/><g transform="translate(540 760)"><circle r="300" fill="#fff" stroke="#111" stroke-width="16"/>

    <g transform="translate(200 420)"><circle r="90" fill="#ffd23f" stroke="#111" stroke-width="10"/>${Array.from({ length: 8 }, (_, i) => { const a = i / 8 * 6.283; return `<path d="M${110 * Math.cos(a)} ${110 * Math.sin(a)} L${150 * Math.cos(a)} ${150 * Math.sin(a)}" stroke="#ffd23f" stroke-width="14" stroke-linecap="round"/>`; }).join("")}<text y="200" font-size="40" text-anchor="middle" fill="#fff">≈ СОЛНЦЕ</text></g>`;
  $("#a7").innerHTML = space() + `<g transform="translate(540 800)"><path d="M0 -330 L300 200 H-300Z" fill="#ffd23f" stroke="#111" stroke-width="18" stroke-linejoin="round"/><text y="140" font-size="300" text-anchor="middle" fill="#111">!</text></g>`;
}
// позиция в тоннеле: u от -1 (верх) до 1 (низ)
const posY = (u) => CY + u * (R + 10);
const U = {
  s1(lt, t) {
    $("#a1").style.transform = ""; P("p1", CX, CY - R - 70, 1.1, { la: 150 + 10 * Math.sin(t * 6), ra: 150, face: "happy", tilt: 4 * Math.sin(t * 5) });
    $("#hook1").style.opacity = 1; $("#hook1").style.transform = `scale(${1 + .03 * Math.sin(t * 7)})`;
  },
  s2(lt, t) {
    const k = prog(t, 3.6, 11.2), u = -Math.cos(Math.PI / 2 * k); P("p2", CX, posY(u) + 60, .95, { la: 160, ra: 160, face: t > 8.6 ? "shock" : "panic" }, 180);
    const v = Math.round(30000 * Math.sin(Math.PI / 2 * k) / 100) * 100; $("#sp2").innerHTML = `${v.toLocaleString("ru")}<small>КМ/Ч</small>`;
    $("#sl2").innerHTML = [0, 1, 2, 3].map((i) => `<path d="M${CX - 20 + i * 14} ${posY(u) - 120 - ((t * 600 + i * 40) % 200)} v-60"/>`).join("");
  },
  s3(lt, t) {
    const k = prog(t, 11.2, 15.0), u = Math.sin(Math.PI / 2 * k * .6); P("p3", CX, posY(u) + 60, .95, { la: 160, ra: 160, face: "worried" }, 180);
    $("#sp3").innerHTML = `${(Math.round(30000 * Math.cos(Math.PI / 2 * k * .6) / 100) * 100).toLocaleString("ru")}<small>КМ/Ч</small>`;
    $("#ar3").setAttribute("opacity", t > 13.6 ? 1 : 0);
  },
  s4(lt, t) {
    const k = prog(t, 15.0, 17.6), back = prog(t, 18.6, 19.8), u = lerp(.6, 1, Math.sin(Math.PI / 2 * k)) - .5 * back * back;
    P("p4", CX, posY(u) + 60, 1.0, { la: t > 17.0 && t < 18.6 ? 100 : 160, ra: t > 17.0 && t < 18.6 ? 30 + 30 * Math.sin(t * 12) : 160, face: t > 18.6 ? "shock" : "happy" }, 180);
  },
  s5(lt, t) {
    const a = lerp(0, 240, prog(t, 19.8, 22.0)) * Math.PI / 180, x = 230 * Math.sin(a), y = -230 * Math.cos(a);
    $("#hn5").setAttribute("d", `M0 0 L${x.toFixed(0)} ${y.toFixed(0)}`); $("#sec5").setAttribute("d", `M0 0 L0 -230 A230 230 0 ${a > Math.PI ? 1 : 0} 1 ${x.toFixed(0)} ${y.toFixed(0)} Z`);
  },
  s6(lt, t) {
    $("#th6").setAttribute("height", 270 * prog(t, 22.4, 24.0)); $("#th6").setAttribute("y", -10 - 270 * prog(t, 22.4, 24.0));
    $("#fl6").innerHTML = Array.from({ length: 8 }, (_, i) => { const k = (t * .8 + i / 8) % 1, x = 540 + Math.cos(i * 2.4) * 430; return `<circle cx="${x.toFixed(0)}" cy="${(820 + 420 - k * 900).toFixed(0)}" r="${(30 - 25 * k).toFixed(0)}" fill="#ff9a3a" opacity="${1 - k}"/>`; }).join("");
  },

const UPD = makeUPD(U);
function SOUND(sfx, add) {

  add(17.0, sfx.pop); add(18.7, sfx.whooshDown); for (let t = 20.0; t < 22.0; t += .25) add(t, sfx.tick); add(22.0, sfx.ding);
  add(22.3, (a) => sfx.fire(a, 4.2)); add(23.4, sfx.boom); add(26.7, sfx.no);
  E.forEach((e) => { if (e[6] > 0) add(Math.max(0, e[6] - .02), sfx.pop); }); add(30.45, sfx.whooshDown); add(32.8, (a) => sfx.riser(a, .5));
}
