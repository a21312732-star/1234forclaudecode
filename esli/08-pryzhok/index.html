<body>

    <div class="hook" id="hook1" style="font-size:84px">ВСЕ ЛЮДИ<br><b>ПОДПРЫГНУТ</b> РАЗОМ?</div></div>
  <div class="scene" id="s2"><svg class="full" width="1080" height="1920" viewBox="0 0 1080 1920" id="a2"></svg><div class="num" id="n2">0<small>ЛЮДЕЙ</small></div></div>
  <div class="scene" id="s3"><svg class="full" width="1080" height="1920" viewBox="0 0 1080 1920" id="a3"></svg></div>

<script>
"use strict";
const DUR = 31.3;
// Растяжка таймлайна под озвучку: пары [время сценария, время видео]. Строку генерирует tools/make-voice.py
const WARP = [[0, 0.00], [0.1, 0.10], [3, 3.48], [6.8, 7.07], [8.6, 9.11], [11.6, 14.30], [17, 20.01], [18.8, 22.08], [20.2, 23.56], [23.4, 26.45], [25.6, 29.77], [28, 32.23], [29.2, 33.39], [31, 34.62], [31.3, 34.92]];
const SCENES = [
  { id: "s1", s: 0, e: 3.0 }, { id: "s2", s: 3.0, e: 8.6 }, { id: "s3", s: 8.6, e: 17.0 }, { id: "s4", s: 17.0, e: 21.6 },
  { id: "s5", s: 21.6, e: 25.6 }, { id: "s6", s: 25.6, e: 28.0 }, { id: "s7", s: 28.0, e: 31.0 }, { id: "s8", s: 31.0, e: 31.3 },
];
const SPEAK = [];
const DROP = ["подписывайся"];
const SHAKES = [], FLASHES = [];
const clockText = (t) => (t >= 3.0 && t < 28.0 ? "ЕСЛИ ВДРУГ · #8" : null);
const CAPS = [
  [0.1, "Что будет, если {y:все люди на Земле одновременно подпрыгнут?}"],
  [3, "Нас {y:восемь миллиардов,}"], [4.33, "и вместе мы весим {y:сотни миллионов тонн.}"], [6.8, "Кажется, планета должна сдвинуться."],
  [8.6, "Но Земля тяжелее всего человечества {r:в десятки триллионов раз.}"],
  [11.6, "Когда мы подпрыгнем, она сдвинется {y:на расстояние меньше атома,}"], [14.73, "а когда приземлимся — вернётся обратно."],
  [17, "{g:Никаких землетрясений не будет.}"],
  [18.8, "Самое трудное начнётся потом:"], [20.2, "{r:собрать всех людей в одном месте} и развезти по домам."],
  [23.4, "Так что прыгать вместе можно, {g:но только ради веселья.}"],
  [25.6, "Пиши в комменты, {y:что проверить дальше.}"], [28, "А пока представь:"], [29.2, "{y:что будет, если...}"], [31, ""]
];
const MUSIC = { bpm: 112, root: 55, parts: [[0, 8.6, "pulse", .7], [8.6, 25.6, "drive", .5], [25.6, 28.0, "pad", .6], [28.0, 31.3, "pulse", .8]] };
const E = [
  ["s3", "e3a", "badge b-yel", "c", 220, "🌍 ТЯЖЕЛЕЕ В ТРИЛЛИОНЫ РАЗ", 8.7, 99, -2, "font-size:42px"],
  ["s3", "e3b", "badge b-wht", "c", 1060, "⚛ СДВИГ МЕНЬШЕ АТОМА", 11.7, 99, 2, "font-size:46px"],
  ["s4", "e4a", "badge b-grn", "c", 220, "✅ БЕЗ ЗЕМЛЕТРЯСЕНИЙ", 17.1, 99, -2, "font-size:50px"],
  ["s5", "e5a", "badge b-red", "c", 220, "🚌 А ДОМОЙ КАК?", 20.3, 99, 2, "font-size:58px"],
  ["s6", "m6a", "cmt", 90, 1000, "а если исчезнет интернет? 📵", 25.7, 99, -3], ["s6", "m6b", "cmt", 330, 1100, "а если все замолчат? 🤫", 26.1, 99, 2],
];
const PALS = [{ coat: "#ff8a3d", coat2: "#d96a1f", hair: "#3b2a1e", pants: "#3b3f58" }, { coat: "#3a7bd5", coat2: "#24539a", hair: "#222", pants: "#2d3a4f" }, { coat: "#4caf50", coat2: "#2e7d32", hair: "#6b3e1f", pants: "#3b3f58" }, { coat: "#e8553d", coat2: "#b83a26", hair: "#b5651d", pants: "#2d3a4f" }];
const crowd = (pre, n) => Array.from({ length: n }, (_, i) => person(pre + i, PALS[i % 4])).join("");
const placeCrowd = (pre, n, t, y, s, jump, cols = 6) => { for (let i = 0; i < n; i++) { const r = Math.floor(i / cols), c = i % cols, sc = s * (1 - r * .12);
  P(pre + i, 100 + c * (880 / (cols - 1)) + (r % 2) * 40, y - r * 70 - 88 * sc - jump * 180 * sc, sc, { la: jump > .1 ? 160 : 20, ra: jump > .1 ? 160 : 20, ll: jump > .1 ? 20 : 0, rl: jump > .1 ? -20 : 0, face: jump > .1 ? "happy" : "calm" }); } };
function build() {
  buildE(E);
  $("#a1").innerHTML = space() + `<g transform="translate(540 1500)">${earth("ea1", 520)}</g>` + crowd("c1_", 6);
  $("#a2").innerHTML = skyDay() + `<g id="cr2">${crowd("c2_", 18)}</g>`;
  $("#a3").innerHTML = `<rect width="${W}" height="${H}" fill="#f2ead8"/><g transform="translate(540 820)"><path d="M-440 0 H440" stroke="#111" stroke-width="16"/><path d="M0 0 L-60 140 H60Z" fill="#7a5232" stroke="#111" stroke-width="8"/>
    <g id="bm3"><path d="M-440 0 H440" stroke="#111" stroke-width="16"/><g transform="translate(-330 -10)"><g transform="scale(.5)">${earth("ea3", 300)}</g></g><g transform="translate(330 -40)">${person("tp3", PALS[0])}</g></g></g>`;
  $("#a4").innerHTML = skyDay() + city() + `<g id="cr4">${crowd("c4_", 12)}</g>`;
  $("#a5").innerHTML = `<rect width="${W}" height="${H}" fill="#cfe9f7"/><rect y="${GR}" width="${W}" height="${H - GR}" fill="#8a8f99"/>` + `<g id="cr5">${crowd("c5_", 30)}</g>` + `<g id="bs5"><rect x="-200" y="${GR - 240}" width="400" height="200" rx="30" fill="#ffd23f" stroke="#111" stroke-width="8"/>${[0, 1, 2, 3].map((i) => `<rect x="${-170 + i * 90}" y="${GR - 210}" width="70" height="70" fill="#bfe3f5" stroke="#111" stroke-width="5"/>`).join("")}<circle cx="-110" cy="${GR - 30}" r="34" fill="#222"/><circle cx="110" cy="${GR - 30}" r="34" fill="#222"/></g>`;
  $("#a6").innerHTML = space() + `<g transform="translate(540 1500)">${earth("ea6", 520)}</g>` + crowd("c6_", 6);
}
const ring = (pre, n, t, jump) => { for (let i = 0; i < n; i++) { const a = -Math.PI / 2 + (i - (n - 1) / 2) * .28, r = 520 + 100 + jump * 120; P(pre + i, 540 + Math.cos(a) * r, 1500 + Math.sin(a) * r, .9, { la: jump > .1 ? 160 : 20, ra: jump > .1 ? 160 : 20, face: "happy" }, a * 180 / Math.PI + 90); } };
const U = {
  s1(lt, t) { $("#a1").style.transform = ""; setEarth("ea1", t * 30, "calm"); ring("c1_", 6, t, Math.max(0, Math.sin(t * 3))); $("#hook1").style.opacity = 1; $("#hook1").style.transform = `scale(${1 + .03 * Math.sin(t * 7)})`; },
  s2(lt, t) { placeCrowd("c2_", 18, t, GR + 300, 1.1, 0); $("#n2").innerHTML = `${(8 * easeOut(prog(t, 3.1, 4.8))).toFixed(1).replace(".", ",")} МЛРД<small>${t > 4.6 ? "СОТНИ МИЛЛИОНОВ ТОНН" : "ЛЮДЕЙ"}</small>`; },
  s3(lt, t) { setEarth("ea3", 0, "calm"); $("#bm3").setAttribute("transform", `rotate(${-14 + .5 * Math.sin(t * 2)})`); P("tp3", 0, 0, .9, { la: 20, ra: 20, face: "worried" }); },
  s4(lt, t) { const j = Math.max(0, Math.sin((t - 17.0) * 3)); placeCrowd("c4_", 12, t, GR + 280, 1.2, j); },
  s5(lt, t) { for (let i = 0; i < 30; i++) P("c5_" + i, 60 + (i % 10) * 105 + 10 * Math.sin(t * 3 + i), GR - 88 * .9 + Math.floor(i / 10) * 40 - 80, .9, { la: 30, ra: 30, face: i % 3 ? "worried" : "panic" }); $("#bs5").setAttribute("transform", `translate(${lerp(1300, 540, easeOut(prog(t, 21.8, 23.4)))} 0)`); },
  s6(lt, t) { setEarth("ea6", t * 30, "calm"); ring("c6_", 6, t, Math.max(0, Math.sin(t * 3))); },
  s7(lt, t) { loopTo(U, t, 28.0, 31.0, "540px 1100px"); },
  s8() { holdFirst(U); },
};
const UPD = makeUPD(U);
function SOUND(sfx, add) {
  for (let t = .5; t < 3; t += 1.05) add(t, sfx.boom); add(3.2, (a) => sfx.riser(a, 1.6)); add(8.7, sfx.no); add(11.7, sfx.ding);
  [17.1, 18.15].forEach((t) => add(t + .5, sfx.boom)); add(20.3, (a) => sfx.noise(a, 2, "bandpass", 700, .8, .15, .4)); add(23.5, sfx.ok);
  E.forEach((e) => { if (e[6] > 0) add(Math.max(0, e[6] - .02), sfx.pop); }); add(28.05, sfx.whooshDown); add(30.6, (a) => sfx.riser(a, .5));
}
ENGINE.start();
</script>
