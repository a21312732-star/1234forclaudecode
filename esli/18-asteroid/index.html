    <div class="hook" id="hook1" style="font-size:76px">АСТЕРОИД<br><b>ВРЕЖЕТСЯ В ЗЕМЛЮ?</b> ☄</div></div>
  <div class="scene" id="s2"><svg class="full" width="1080" height="1920" viewBox="0 0 1080 1920" id="a2"></svg></div>

<script>
"use strict";
const DUR = 22.5;
// Растяжка таймлайна под озвучку: пары [время сценария, время видео]. Строку генерирует tools/make-voice.py
const WARP = [[0, 0.00], [0.1, 0.10], [3, 2.76], [6.8, 6.21], [9.2, 8.66], [11, 10.67], [13.2, 12.81], [16.8, 16.75], [18.2, 18.15], [19.2, 19.08], [20.4, 20.26], [22.2, 21.16], [22.5, 21.46]];
const SCENES = [
  { id: "s1", s: 0, e: 3.0 }, { id: "s2", s: 3.0, e: 6.8 }, { id: "s3", s: 6.8, e: 9.2 }, { id: "s4", s: 9.2, e: 13.2 },
  { id: "s5", s: 13.2, e: 16.8 }, { id: "s6", s: 16.8, e: 19.2 }, { id: "s7", s: 19.2, e: 22.2 }, { id: "s8", s: 22.2, e: 22.5 },
];
const SPEAK = [];
const DROP = ["подписывайся"];
const SHAKES = [7.0], FLASHES = [6.9];
const clockText = (t) => (t >= 3.0 && t < 19.2 ? "ЕСЛИ ВДРУГ · #18" : null);
const CAPS = [
  [0.1, "Что будет, если {r:в Землю врежется астероид размером с город?}"],
  [3, "Такой уже падал {y:шестьдесят шесть миллионов лет назад,}"], [5.62, "и {r:вымерли динозавры.}"],
  [6.8, "При ударе выделится энергия {r:миллиардов атомных бомб.}"],
  [9.2, "Облако пыли {r:закроет Солнце на годы.}"], [11, "Станет темно и холодно, растения погибнут."],
  [13.2, "Хорошо, что учёные следят за астероидами"], [15.14, "и {g:уже умеют сбивать их с курса.}"],
  [16.8, "Как думаешь, {y:ты бы выжил?}"], [18.2, "Пиши в комменты."], [19.2, "А пока представь:"], [20.4, "{y:что будет, если...}"], [22.2, ""]
];
const MUSIC = { bpm: 88, root: 41, parts: [[0, 6.8, "pad", .7], [6.8, 16.8, "pulse", .6], [16.8, 22.5, "pulse", .7]] };
const E = [
  ["s2", "e2a", "badge b-yel", "c", 220, "🦖 66 МЛН ЛЕТ НАЗАД", 3.1, 99, -2, "font-size:54px"],
  ["s3", "e3a", "badge b-red", "c", 220, "💥 МИЛЛИАРДЫ АТОМНЫХ БОМБ", 6.9, 99, 2, "font-size:46px"],
  ["s4", "e4a", "badge b-wht", "c", 220, "🌫 ПЫЛЬ ЗАКРОЕТ СОЛНЦЕ", 9.3, 99, -2, "font-size:48px"], ["s4", "e4b", "badge b-blu", "c", 330, "🥶 ТЕМНО И ХОЛОДНО", 11.1, 99, 2, "font-size:52px"],
  ["s5", "e5a", "badge b-grn", "c", 220, "🚀 УМЕЕМ СБИВАТЬ С КУРСА", 15.1, 99, 2, "font-size:46px"],
  ["s6", "m6a", "cmt", 90, 1000, "я бы спрятался в бункер 🕳", 16.9, 99, -3], ["s6", "m6b", "cmt", 330, 1100, "динозавров жалко 🦖", 17.3, 99, 2],
];
const stars = () => `<rect width="${W}" height="${H}" fill="#05030f"/>${Array.from({ length: 110 }, (_, i) => `<circle cx="${(hash(i) * W).toFixed(0)}" cy="${(hash(i + 70) * H).toFixed(0)}" r="${(1 + 3 * hash(i + 9)).toFixed(1)}" fill="#fff" opacity="${(.3 + .6 * hash(i + 3)).toFixed(2)}"/>`).join("")}`;
const rock = (id, r) => `<g id="${id}"><path d="M${-r} 0 Q${-r} ${-r * .9} 0 ${-r} Q${r * 1.1} ${-r * .8} ${r} 0 Q${r * .9} ${r} 0 ${r * .9} Q${-r * 1.1} ${r * .8} ${-r} 0Z" fill="#7a6a5a" stroke="#111" stroke-width="9"/><circle cx="${-r * .3}" cy="${-r * .2}" r="${r * .2}" fill="#5a4a3a"/><circle cx="${r * .35}" cy="${r * .3}" r="${r * .15}" fill="#5a4a3a"/></g>`;
const trail = (id) => `<path id="${id}" fill="#ffb03a" opacity=".7"/>`;
const dino = `<g transform="translate(560 ${GR})"><path d="M-260 0 L-240 -120 Q-200 -220 -60 -230 Q40 -240 90 -300 Q110 -380 180 -380 Q240 -380 240 -330 Q240 -300 200 -290 L160 -280 Q140 -220 120 -160 L130 0 L80 0 L70 -110 L-80 -110 L-90 0 L-140 0 L-150 -120 Q-220 -110 -330 -40Z" fill="#2a3a2a" stroke="#111" stroke-width="8"/></g>`;
const HERO = { coat: "#ff8a3d", coat2: "#d96a1f", pants: "#3a7bd5", hair: "#3b2a1e", scarf: "#3aa0ff" };
function build() {
  buildE(E);
  $("#a1").innerHTML = stars() + `<g transform="translate(540 1300)">${earth("ea1", 300)}</g>` + trail("tr1") + rock("rk1", 70);
  $("#a2").innerHTML = `<rect width="${W}" height="${H}" fill="#e88a4a"/><rect y="${GR}" width="${W}" height="${H - GR}" fill="#8a6a3a"/>` + trail("tr2") + rock("rk2", 60) + dino;
  $("#a3").innerHTML = stars() + `<g transform="translate(540 1000)">${earth("ea3", 300)}</g><circle id="bm3" cx="700" cy="760" r="10" fill="#fff6a0"/>`;
  $("#a4").innerHTML = skyDay() + city() + `<rect id="du4" width="${W}" height="${H}" fill="#3a3028" opacity="0"/>` + person("p4", HERO) + `<g id="sn4"></g>`;
  $("#a5").innerHTML = stars() + rock("rk5", 110) + `<g id="sp5"><rect x="-50" y="-26" width="100" height="52" rx="10" fill="#dfe4ea" stroke="#111" stroke-width="7"/><rect x="-140" y="-10" width="90" height="20" fill="#3aa0ff" stroke="#111" stroke-width="5"/><rect x="50" y="-10" width="90" height="20" fill="#3aa0ff" stroke="#111" stroke-width="5"/></g><path id="pa5" fill="none" stroke="#fff" stroke-width="6" stroke-dasharray="16 14"/>`;
  $("#a6").innerHTML = stars() + `<g transform="translate(540 1300)">${earth("ea6", 300)}</g>` + rock("rk6", 70);
}
const fly = (rid, tid, x, y, s = 1) => { at(rid, x, y, s, 1, x / 3); $("#" + tid).setAttribute("d", `M${x - 40 * s} ${y - 40 * s} L${x - 420 * s} ${y - 520 * s} L${x + 40 * s} ${y + 10 * s}Z`); };
const U = {
  s1(lt, t) { $("#a1").style.transform = ""; setEarth("ea1", t * 20, t > 1.5 ? "shock" : "calm"); const k = prog(t, 0, 3.0); fly("rk1", "tr1", lerp(860, 650, k), lerp(300, 800, k), lerp(.8, 1.3, k)); $("#hook1").style.opacity = 1; $("#hook1").style.transform = `scale(${1 + .03 * Math.sin(t * 7)})`; },
  s2(lt, t) { const k = prog(t, 3.0, 6.8); fly("rk2", "tr2", lerp(900, 700, k), lerp(300, 700, k), lerp(.8, 1.4, k)); },
  s3(lt, t) { setEarth("ea3", 0, "shock"); const k = easeOut(prog(t, 6.9, 7.8)); $("#bm3").setAttribute("r", 10 + 420 * k); $("#bm3").setAttribute("opacity", 1 - .6 * k); },
  s4(lt, t) { $("#du4").setAttribute("opacity", .75 * prog(t, 9.2, 10.6)); P("p4", 540, GR - 88 * 1.6, 1.6, { la: 30, ra: 30, face: t > 11 ? "cold" : "worried" });
    $("#sn4").innerHTML = t > 11 ? Array.from({ length: 30 }, (_, i) => { const q = (t * .3 + hash(i)) % 1; return `<circle cx="${(hash(i + 3) * W).toFixed(0)}" cy="${(q * H).toFixed(0)}" r="6" fill="#ddd" opacity=".8"/>`; }).join("") : ""; },
  s5(lt, t) { const hit = 15.0, k = prog(t, 13.2, hit), d = prog(t, hit, 16.8); at("rk5", 640 + 140 * d, 760 - 260 * d, 1, 1, t * 20); at("sp5", lerp(120, 560, k), lerp(1500, 860, k), 1, k < 1 ? 1 : 0, -50);
    $("#pa5").setAttribute("d", d > 0 ? `M640 760 Q900 420 1100 300` : ""); },
  s6(lt, t) { setEarth("ea6", t * 20, "calm"); at("rk6", 860, 300, .8, 1, t * 20); },
  s7(lt, t) { loopTo(U, t, 19.2, 22.2); },
  s8() { holdFirst(U); },
};
const UPD = makeUPD(U);
function SOUND(sfx, add) {
  add(.2, (a) => sfx.riser(a, 2.8)); add(3.1, sfx.whoosh); add(6.9, sfx.boom); add(7.0, (a) => sfx.noise(a, 2, "lowpass", 300, 1, .6, .1)); add(9.3, (a) => sfx.wind(a, 3.8, .7)); add(15.0, sfx.hit); add(15.1, sfx.ok);
  E.forEach((e) => { if (e[6] > 0) add(Math.max(0, e[6] - .02), sfx.pop); }); add(19.25, sfx.whooshDown); add(21.6, (a) => sfx.riser(a, .5));
}

ENGINE.start();
</script>
