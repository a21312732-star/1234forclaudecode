<body>
<div id="wrap"><div id="stage"><div id="cam">
  <div class="scene" id="s1"><svg class="full" width="1080" height="1920" viewBox="0 0 1080 1920" id="a1"></svg>
    <div class="hook" id="hook1" style="font-size:90px">ВЫПИТЬ<br><b>10 ЛИТРОВ</b> ВОДЫ?</div></div>
  <div class="scene" id="s2"><svg class="full" width="1080" height="1920" viewBox="0 0 1080 1920" id="a2"></svg><div class="big2" id="b2">1 Л<small>В ЧАС — МАКСИМУМ ПОЧЕК</small></div></div>
  <div class="scene" id="s3"><svg class="full" width="1080" height="1920" viewBox="0 0 1080 1920" id="a3"></svg></div>
  <div class="scene" id="s4"><svg class="full" width="1080" height="1920" viewBox="0 0 1080 1920" id="a4"></svg></div>
  <div class="scene" id="s5"><svg class="full" width="1080" height="1920" viewBox="0 0 1080 1920" id="a5"></svg></div>
  <div class="scene" id="s6"><svg class="full" width="1080" height="1920" viewBox="0 0 1080 1920" id="a6"></svg></div>

</div></div></div>

<script>
"use strict";
const DUR = 34.7;
// Растяжка таймлайна под озвучку: пары [время сценария, время видео]. Строку генерирует tools/make-voice.py
const WARP = [[0, 0], [34.7, 34.7]];
const SCENES = [
  { id: "s1", s: 0, e: 3.0 }, { id: "s2", s: 3.0, e: 7.6 }, { id: "s3", s: 7.6, e: 14.0 }, { id: "s4", s: 14.0, e: 18.0 },
  { id: "s5", s: 18.0, e: 26.6 }, { id: "s6", s: 26.6, e: 31.4 }, { id: "s7", s: 31.4, e: 34.4 }, { id: "s8", s: 34.4, e: 34.7 },
];
const SPEAK = [];
const DROP = ["подписывайся"];
const SHAKES = [19.8];
const FLASHES = [];
const clockText = (t) => (t >= 3.0 && t < 31.4 ? "ЕСЛИ ВДРУГ · #5" : null);
const CAPS = [
  [0.1, "Что будет, если {y:выпить десять литров воды за раз?}"],
  [3.0, "Кажется, вода — это просто вода."],
  [4.8, "Но почки выводят {y:примерно литр в час,} не больше."],
  [7.6, "Всё лишнее остаётся в крови"],
  [9.0, "и {r:разбавляет соль,} которая нужна нашим клеткам."],
  [11.8, "Клетки начинают {r:набухать, как губки.}"],
  [14.0, "И самое опасное — {r:набухает мозг,}"],
  [16.0, "которому некуда расширяться в черепе."],
  [18.0, "Сначала тошнота и головная боль,"],
  [19.8, "потом {r:путаница в мыслях, судороги и потеря сознания.}"],
  [23.2, "Это называется {y:водное отравление,}"],
  [25.0, "и от него {r:правда умирали.}"],
  [26.6, "{g:Так что пей воду по жажде,} а не на спор."],
  [29.0, "Пиши в комменты, {y:что проверить дальше.}"],
  [31.4, "А пока представь:"],
  [32.6, "{y:что будет, если...}"],
  [34.4, ""]
];
const MUSIC = { bpm: 100, root: 52, parts: [[0, 14.0, "pulse", .7], [14.0, 26.6, "pad", .7], [26.6, 31.4, "pulse", .5], [31.4, 34.7, "pulse", .8]] };
const E = [
  ["s3", "e3a", "badge b-red", "c", 220, "🧂 СОЛЬ РАЗБАВЛЯЕТСЯ", 9.1, 99, -2, "font-size:50px"],
  ["s3", "e3b", "badge b-yel", "c", 340, "🧽 КЛЕТКИ НАБУХАЮТ", 11.9, 99, 2, "font-size:50px"],
  ["s4", "e4a", "badge b-red", "c", 220, "🧠 МОЗГУ НЕКУДА РАСТИ", 14.1, 99, -2, "font-size:50px"],
  ["s5", "e5a", "badge b-red", "c", 220, "☠ ВОДНОЕ ОТРАВЛЕНИЕ", 23.3, 99, -2, "font-size:50px"],
  ["s6", "e6a", "badge b-grn", "c", 220, "💧 ПЕЙ ПО ЖАЖДЕ", 26.7, 99, -2, "font-size:58px"],
  ["s6", "m6a", "cmt", 90, 1000, "а если не есть неделю? 🍔", 29.1, 99, -3], ["s6", "m6b", "cmt", 330, 1100, "а если съесть 100 конфет? 🍬", 29.5, 99, 2],
];
const HERO = { coat: "#ff8a3d", coat2: "#d96a1f", hair: "#3b2a1e", pants: "#3b3f58" };
const room = () => `<rect width="${W}" height="${H}" fill="#4a3f7a"/><rect y="${GR}" width="${W}" height="${H - GR}" fill="#3a2f5a"/>`;
const bottle = (x, y, s = 1, lvl = 1) => `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-50" y="-260" width="100" height="260" rx="30" fill="#bfe3f5" opacity=".5" stroke="#111" stroke-width="7"/><rect x="-44" y="${-254 + 248 * (1 - lvl)}" width="88" height="${248 * lvl}" rx="24" fill="#3aa0ff"/><rect x="-24" y="-300" width="48" height="44" fill="#3aa0ff" stroke="#111" stroke-width="6"/></g>`;
const cell = (id) => `<g id="${id}"><circle r="90" fill="#ff9aa8" stroke="#111" stroke-width="8"/><circle cx="-20" cy="-10" r="26" fill="#c94a6a"/>${Array.from({ length: 8 }, (_, i) => `<circle class="na" r="7" fill="#fff" stroke="#111" stroke-width="2"/>`).join("")}</g>`;
function build() {
  buildE(E);
  $("#a1").innerHTML = room() + `<g id="bt1">${Array.from({ length: 10 }, (_, i) => bottle(150 + (i % 5) * 190, GR - 30 - Math.floor(i / 5) * 300, .8)).join("")}</g>` + person("p1", HERO);
  $("#a2").innerHTML = `<rect width="${W}" height="${H}" fill="#2b2350"/><g transform="translate(540 980)"><path d="M-160 -200 Q-260 -60 -160 160 Q-80 240 -40 120 Q-10 0 -60 -120 Q-80 -200 -160 -200Z" fill="#c95a5a" stroke="#111" stroke-width="10"/>
    <path d="M160 -200 Q260 -60 160 160 Q80 240 40 120 Q10 0 60 -120 Q80 -200 160 -200Z" fill="#c95a5a" stroke="#111" stroke-width="10"/><g id="dr2"></g></g>`;
  $("#a3").innerHTML = `<rect width="${W}" height="${H}" fill="#3a1a3a"/><rect id="bl3" width="${W}" height="${H}" fill="#9a2a3a"/>` + `<g transform="translate(330 900)">${cell("c3a")}</g><g transform="translate(750 1000)">${cell("c3b")}</g>`;
  $("#a4").innerHTML = `<rect width="${W}" height="${H}" fill="#2b2350"/><g transform="translate(540 900)"><path d="M-300 120 Q-320 -300 0 -340 Q320 -300 300 120 Q260 260 120 280 L120 360 L-120 360 L-120 280 Q-260 260 -300 120Z" fill="#f4e6d0" stroke="#111" stroke-width="14"/>
    <g id="br4"><path d="M-220 40 Q-240 -230 0 -250 Q240 -230 220 40 Q200 160 0 170 Q-200 160 -220 40Z" fill="#ffb0c0" stroke="#111" stroke-width="8"/>${[-120, -40, 40, 120].map((x) => `<path d="M${x} -200 q30 60 0 120 q-30 60 0 120" stroke="#e07a90" stroke-width="8" fill="none"/>`).join("")}</g></g>`;
  $("#a5").innerHTML = room() + person("p5", HERO) + `<g id="st5"></g>`;
  $("#a6").innerHTML = room() + bottle(780, GR - 30, 1, .5) + person("p6", HERO) + `<g transform="translate(260 ${GR - 320})"><rect x="-40" y="0" width="80" height="110" rx="10" fill="#bfe3f5" opacity=".6" stroke="#111" stroke-width="6"/><rect x="-34" y="40" width="68" height="64" fill="#3aa0ff"/></g>`;
}
const hip = (s) => GR - 88 * s;
const U = {
  s1(lt, t) { $("#a1").style.transform = ""; P("p1", 540, hip(1.8), 1.8, { la: 150, ra: 30, face: "shock" }); $("#hook1").style.opacity = 1; $("#hook1").style.transform = `scale(${1 + .03 * Math.sin(t * 7)})`; },
  s2(lt, t) { $("#dr2").innerHTML = Array.from({ length: 6 }, (_, i) => { const k = (t * .8 + i / 6) % 1; return `<path d="M${(i % 2 ? 1 : -1) * 100} ${-200 + k * 500} q14 22 0 30 q-14 -8 0 -30Z" fill="#3aa0ff" opacity="${1 - k}"/>`; }).join(""); $("#b2").style.opacity = t > 4.8 ? 1 : 0; },
  s3(lt, t) {
    const k = prog(t, 9.0, 11.5), sw = 1 + .45 * prog(t, 11.8, 13.6); $("#bl3").setAttribute("fill", `rgb(${Math.round(lerp(154, 230, k))},${Math.round(lerp(42, 140, k))},${Math.round(lerp(58, 170, k))})`);
    ["c3a", "c3b"].forEach((c, j) => { $("#" + c).setAttribute("transform", `scale(${sw + .03 * Math.sin(t * 5 + j)})`); $$(`#${c} .na`).forEach((n, i) => { const a = i / 8 * 6.283 + t; n.setAttribute("cx", (60 + 40 * k) * Math.cos(a)); n.setAttribute("cy", (60 + 40 * k) * Math.sin(a)); n.setAttribute("opacity", 1 - .7 * k); }); });
  },
  s4(lt, t) { $("#br4").setAttribute("transform", `scale(${1 + .2 * prog(t, 14.2, 17.0) + .02 * Math.sin(t * 8)})`); },
  s5(lt, t) {
    const conf = t > 19.8, faint = easeInOut(prog(t, 21.6, 22.6)); P("p5", 540 + (conf ? 10 * Math.sin(t * 14) : 0), lerp(hip(1.8), GR - 50, faint), 1.8, { la: -90, ra: -90 + (conf ? 30 * Math.sin(t * 10) : 0), face: faint > .5 ? "worried" : conf ? "panic" : "worried", tilt: conf ? 12 * Math.sin(t * 6) : 0 }, -90 * faint);
    $("#st5").innerHTML = conf && faint < 1 ? [0, 1, 2].map((i) => { const a = t * 3 + i * 2.1; return `<text x="${540 + 90 * Math.cos(a)}" y="${hip(1.8) - 300 + 30 * Math.sin(a)}" font-size="60" fill="#ffd23f">★</text>`; }).join("") : "";
  },
  s6(lt, t) { P("p6", 540, hip(1.8), 1.8, { la: 20, ra: 130, face: "happy" }); },
  s7(lt, t) { loopTo(U, t, 31.4, 34.4); },
  s8() { holdFirst(U); },
};
const UPD = makeUPD(U);
function SOUND(sfx, add) {
  for (let t = .3; t < 3.0; t += .4) add(t, (a) => sfx.noise(a, .12, "lowpass", 500, 2, .25, .01)); add(4.9, sfx.ding); add(9.1, (a) => sfx.bubbles(a, 5)); add(14.1, sfx.boom);
  for (let t = 14.2; t < 18; t += .6) add(t, (a) => sfx.heart(a, .7)); add(19.8, sfx.hit); add(22.6, sfx.whooshDown); add(26.7, sfx.ok);
  E.forEach((e) => { if (e[6] > 0) add(Math.max(0, e[6] - .02), sfx.pop); }); add(31.45, sfx.whooshDown); add(33.8, (a) => sfx.riser(a, .5));
}
ENGINE.start();
</script>
