<!doctype html>

<head>
<meta charset="utf-8">

<body>
<div id="wrap"><div id="stage"><div id="cam">
  <div class="scene" id="s1"><svg class="full" width="1080" height="1920" viewBox="0 0 1080 1920" id="a1"></svg>
    <div class="hook" id="hook1" style="font-size:76px">ЛУНА ПАДАЕТ<br><b>НА ЗЕМЛЮ?</b> 🌕</div></div>
  <div class="scene" id="s2"><svg class="full" width="1080" height="1920" viewBox="0 0 1080 1920" id="a2"></svg></div>
  <div class="scene" id="s3"><svg class="full" width="1080" height="1920" viewBox="0 0 1080 1920" id="a3"></svg></div>
  <div class="scene" id="s4"><svg class="full" width="1080" height="1920" viewBox="0 0 1080 1920" id="a4"></svg></div>
  <div class="scene" id="s5"><svg class="full" width="1080" height="1920" viewBox="0 0 1080 1920" id="a5"></svg></div>
  <div class="scene" id="s6"><svg class="full" width="1080" height="1920" viewBox="0 0 1080 1920" id="a6"></svg></div>
  <div class="scene" id="s7"></div>
  <div class="scene" id="s8"></div>
</div></div></div>
<script src="../../survival/engine.js"></script>
<script src="../../survival/choice.js"></script>

<script>
"use strict";
const DUR = 21.1;
// Растяжка таймлайна под озвучку: пары [время сценария, время видео]. Строку генерирует tools/make-voice.py
const WARP = [[0, 0.00], [0.1, 0.10], [2.6, 2.31], [3.8, 3.53], [7, 6.85], [9.4, 9.48], [12.4, 12.30], [14.6, 14.35], [16.6, 16.07], [17.8, 17.05], [19, 17.96], [20.8, 18.86], [21.1, 19.16]];
const SCENES = [
  { id: "s1", s: 0, e: 2.6 }, { id: "s2", s: 2.6, e: 7.0 }, { id: "s3", s: 7.0, e: 9.4 }, { id: "s4", s: 9.4, e: 12.4 },
  { id: "s5", s: 12.4, e: 14.6 }, { id: "s6", s: 14.6, e: 17.8 }, { id: "s7", s: 17.8, e: 20.8 }, { id: "s8", s: 20.8, e: 21.1 },
];
const SPEAK = [];
const DROP = ["подписывайся"];
const SHAKES = [3.9, 12.5], FLASHES = [2.6];
const clockText = (t) => (t >= 2.6 && t < 17.8 ? "ЕСЛИ ВДРУГ · #16" : null);
const CAPS = [
  [0.1, "Что будет, если {r:Луна начнёт падать на Землю?}"],
  [2.6, "Она {y:не долетит целой.}"], [3.8, "Ещё за тысячи километров {r:притяжение Земли разорвёт её на куски.}"],
  [7, "Вокруг планеты появятся {y:кольца, как у Сатурна.}"], [9.4, "Красиво, но обломки {r:посыплются вниз метеоритным дождём.}"],
  [12.4, "А океаны {r:поднимут огромные приливы.}"],
  [14.6, "Как думаешь, {y:сколько бы ты продержался?}"], [16.6, "Пиши в комменты."], [17.8, "А пока представь:"], [19, "{y:что будет, если...}"], [20.8, ""]
];
const MUSIC = { bpm: 88, root: 41, parts: [[0, 7.0, "pad", .7], [7.0, 14.6, "pulse", .6], [14.6, 21.1, "pulse", .7]] };
const E = [
  ["s2", "e2a", "badge b-red", "c", 220, "💥 ЛУНУ РАЗОРВЁТ", 3.9, 99, -2, "font-size:54px"],
  ["s3", "e3a", "badge b-yel", "c", 220, "🪐 КОЛЬЦА КАК У САТУРНА", 7.1, 99, 2, "font-size:48px"],
  ["s4", "e4a", "badge b-red", "c", 220, "☄ МЕТЕОРИТНЫЙ ДОЖДЬ", 9.5, 99, -2, "font-size:50px"],
  ["s5", "e5a", "badge b-blu", "c", 220, "🌊 ГИГАНТСКИЕ ПРИЛИВЫ", 12.5, 99, 2, "font-size:50px"],
  ["s6", "m6a", "cmt", 90, 1000, "я бы продержался минуту 😅", 14.7, 99, -3], ["s6", "m6b", "cmt", 330, 1100, "кольца — это красиво 🪐", 15.1, 99, 2],
];
const stars = () => `<rect width="${W}" height="${H}" fill="#05030f"/>${Array.from({ length: 110 }, (_, i) => `<circle cx="${(hash(i) * W).toFixed(0)}" cy="${(hash(i + 70) * H).toFixed(0)}" r="${(1 + 3 * hash(i + 9)).toFixed(1)}" fill="#fff" opacity="${(.3 + .6 * hash(i + 3)).toFixed(2)}"/>`).join("")}`;
const moon = (id, r) => `<g id="${id}"><circle r="${r}" fill="#cfcfd6" stroke="#111" stroke-width="10"/>${[[-.35, -.3, .22], [.3, -.1, .16], [-.1, .35, .2], [.4, .4, .1]].map(([x, y, k]) => `<circle cx="${x * r}" cy="${y * r}" r="${k * r}" fill="#a8a8b2" stroke="#111" stroke-width="5"/>`).join("")}</g>`;
const shards = (id, r) => `<g id="${id}">${Array.from({ length: 8 }, (_, i) => { const a = i / 8 * Math.PI * 2, b = (i + 1) / 8 * Math.PI * 2; return `<path class="sh" d="M0 0 L${(r * Math.cos(a)).toFixed(0)} ${(r * Math.sin(a)).toFixed(0)} A${r} ${r} 0 0 1 ${(r * Math.cos(b)).toFixed(0)} ${(r * Math.sin(b)).toFixed(0)}Z" fill="#cfcfd6" stroke="#111" stroke-width="6"/>`; }).join("")}</g>`;
const rings = () => [0, 1, 2].map((i) => `<ellipse rx="${330 + i * 50}" ry="${70 + i * 12}" fill="none" stroke="${["#d8c8a8", "#bfae8a", "#e8dcc0"][i]}" stroke-width="${22 - i * 5}" opacity=".85"/>`).join("");
const HERO = { coat: "#ff8a3d", coat2: "#d96a1f", pants: "#3a7bd5", hair: "#3b2a1e" };
function build() {
  buildE(E);
  $("#a1").innerHTML = stars() + `<g transform="translate(540 1250)">${earth("ea1", 260)}</g>` + moon("mn1", 120);
  $("#a2").innerHTML = stars() + `<g transform="translate(540 1300)">${earth("ea2", 260)}</g>` + `<g transform="translate(540 700)">${shards("sd2", 200)}</g>`;
  $("#a3").innerHTML = stars() + `<g transform="translate(540 960) rotate(-12)"><g opacity=".9">${rings()}</g></g><g transform="translate(540 960)">${earth("ea3", 230)}</g><g transform="translate(540 960) rotate(-12)"><path d="M-430 0 A430 90 0 0 0 430 0" fill="none" stroke="#d8c8a8" stroke-width="22"/></g>`;
  $("#a4").innerHTML = skyDay() + `<rect width="${W}" height="${H}" fill="#5a1a2a" opacity=".55"/>` + city() + `<g id="mt4"></g>` + person("p4", HERO);
  $("#a5").innerHTML = skyDay() + city() + `<path id="wv5" fill="#2b7bbf" stroke="#111" stroke-width="8"/>` + person("p5", HERO);
  $("#a6").innerHTML = stars() + `<g transform="translate(540 1250)">${earth("ea6", 260)}</g>` + moon("mn6", 120);
}
const U = {
  s1(lt, t) { $("#a1").style.transform = ""; setEarth("ea1", t * 20, t > 1.2 ? "shock" : "calm"); const k = Math.pow(prog(t, 0, 2.6), 2); at("mn1", 540, lerp(420, 760, k), lerp(.8, 1.6, k), 1, t * 20);
    $("#hook1").style.opacity = 1; $("#hook1").style.transform = `scale(${1 + .03 * Math.sin(t * 7)})`; },
  s2(lt, t) { setEarth("ea2", t * 20, "shock"); const k = easeOut(prog(t, 3.8, 6.6)); $$("#sd2 .sh").forEach((p, i) => { const a = (i + .5) / 8 * Math.PI * 2; p.setAttribute("transform", `translate(${(Math.cos(a) * 260 * k).toFixed(1)} ${(Math.sin(a) * 120 * k).toFixed(1)}) rotate(${(k * 60 * (i % 2 ? 1 : -1)).toFixed(1)})`); }); },
  s3(lt, t) { setEarth("ea3", t * 30, "happy"); const e = $("#a3"); e.style.transformOrigin = "540px 960px"; e.style.transform = `scale(${1 + .05 * lt})`; },
  s4(lt, t) { $("#mt4").innerHTML = Array.from({ length: 9 }, (_, i) => { const q = ((t * .7 + i / 9) % 1), x = 100 + i * 110 + 300 * q, y = -100 + 1300 * q; return `<path d="M${x} ${y} l-120 -200" stroke="#ffb03a" stroke-width="14" stroke-linecap="round" opacity=".8"/><circle cx="${x}" cy="${y}" r="20" fill="#ff6a1a" stroke="#111" stroke-width="5"/>`; }).join("");
    P("p4", 540, GR - 88 * 1.6, 1.6, { la: 160, ra: 150, face: "panic" }); },
  s5(lt, t) { const k = easeOut(prog(t, 12.4, 14.4)), y = lerp(1500, 500, k); let d = `M-40 ${H} L-40 ${y}`; for (let x = -40; x <= W + 40; x += 60) d += ` L${x} ${(y + 40 * Math.sin(x / 90 + t * 4)).toFixed(0)}`; $("#wv5").setAttribute("d", d + ` L${W + 40} ${H}Z`);
    P("p5", 540, GR - 88 * 1.6, 1.6, { la: 170, ra: 170, face: "panic" }); },
  s6(lt, t) { setEarth("ea6", t * 20, "calm"); at("mn6", 540, 420, .8, 1, t * 20); },
  s7(lt, t) { loopTo(U, t, 17.8, 20.8); },
  s8() { holdFirst(U); },
};
const UPD = makeUPD(U);
function SOUND(sfx, add) {
  add(.3, (a) => sfx.riser(a, 2.2)); add(2.6, sfx.boom); add(3.9, sfx.crack); add(4.0, sfx.boom); add(7.1, sfx.ding); for (let x = 9.5; x < 12.4; x += .35) add(x, sfx.whooshDown); add(12.5, (a) => sfx.noise(a, 2.2, "lowpass", 500, 1, .5, .1)); add(12.5, sfx.boom);
  E.forEach((e) => { if (e[6] > 0) add(Math.max(0, e[6] - .02), sfx.pop); }); add(17.85, sfx.whooshDown); add(20.2, (a) => sfx.riser(a, .5));
}

ENGINE.start();
</script>
</body>
