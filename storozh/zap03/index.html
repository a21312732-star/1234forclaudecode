<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">

<title>Записки прошлого сторожа №3 — Лифт</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=JetBrains+Mono:wght@700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../survival/engine.css">
</head>
<body>
<div id="wrap"><div id="stage"><div id="cam">
  <div class="scene" id="s1"><svg class="full" width="1080" height="1920" viewBox="0 0 1080 1920" id="a1"></svg>
    <div class="ep">ЗАПИСКИ ПРОШЛОГО СТОРОЖА · №3</div><div class="ttl" id="h1" style="top:170px">ПРАВИЛО №6:<br><i>ЛИФТ НЕ РАБОТАЕТ</i></div></div>
  <div class="scene" id="s2"><svg class="full" width="1080" height="1920" viewBox="0 0 1080 1920" id="a2"></svg></div>
  <div class="scene" id="s3"><svg class="full" width="1080" height="1920" viewBox="0 0 1080 1920" id="a3"></svg></div>
  <div class="scene" id="s4"><svg class="full" width="1080" height="1920" viewBox="0 0 1080 1920" id="a4"></svg>
    <div class="bub red" id="b4" style="top:200px"><i>«Заходи, тебя ждут»</i></div></div>
  <div class="scene" id="s5"><svg class="full" width="1080" height="1920" viewBox="0 0 1080 1920" id="a5"></svg></div>
  <div class="scene" id="s6"><svg class="full" width="1080" height="1920" viewBox="0 0 1080 1920" id="a6"></svg>
    <div class="ttl" id="q6" style="top:1060px;font-size:66px">НАЖАЛ БЫ ТЫ<br><i>ЭТУ КНОПКУ?</i></div>
    <div class="bdg" id="b6" style="top:1260px;background:#fff;color:#111">💬 ПИШИ В КОММЕНТЫ</div></div>
  <div class="scene" id="s7"></div>
</div></div></div>

<script src="../../survival/engine.js"></script>
<script src="../common.js"></script>
<script src="../zap.js"></script>
<script>
"use strict";
const DUR = 24.7;
// Растяжка таймлайна под озвучку: пары [время сценария, время видео]. Строку генерирует tools/make-voice.py
const WARP = [[0, 0.00], [0.1, 0.10], [1.8, 2.11], [4.6, 4.61], [7.2, 7.18], [8.8, 8.93], [11.8, 12.31], [14.8, 14.81], [16.2, 16.32], [17.8, 17.85], [19, 19.41], [21.6, 21.76], [23, 23.18], [24.4, 24.41], [24.7, 24.71]];
const SCENES = [
  { id: "s1", s: 0, e: 1.8 }, { id: "s2", s: 1.8, e: 7.2 }, { id: "s3", s: 7.2, e: 11.8 }, { id: "s4", s: 11.8, e: 17.8 },
  { id: "s5", s: 17.8, e: 21.6 }, { id: "s6", s: 21.6, e: 24.4 }, { id: "s7", s: 24.4, e: 24.7 },
];
const SPEAK = [];
const DROP = ["подписывайся"];
const SHAKES = [7.4];
const FLASHES = [];
const clockText = (t) => (t >= 1.8 && t < 21.6 ? "ЗАПИСКИ ПРОШЛОГО СТОРОЖА · №3" : null);
const CAPS = [
  [0.1, "Последняя запись {y:в журнале.}"],
  [1.8, "«Лифт не работает {y:с восемьдесят седьмого года.}"],
  [4.6, "Электричество к нему отрезано, я проверял."],
  [7.2, "Но этой ночью {r:он приехал.}"],
  [8.8, "Двери открылись на моём этаже,"],
  [10.44, "{r:внутри горел свет.}"],
  [11.8, "На панели была {r:только одна кнопка, без номера.}"],
  [14.8, "И кто-то изнутри сказал:"],
  [16.2, "{r:заходи, тебя ждут.»}"],
  [17.8, "Больше записей нет."],
  [19, "Прошлый сторож {r:так и не вернулся со смены.}"],
  [21.6, "Нажал бы ты эту кнопку?"],
  [23, "Пиши в комменты."],
  [24.4, ""]
];
const MUSIC = { bpm: 60, root: 41, parts: [[0, 24.7, "pad", .6]] };
// шахта лифта: двери (половинки двигаются), табло этажа
const lift = (id) => `<rect width="1080" height="1920" fill="#262c3a"/><rect y="1100" width="1080" height="820" fill="#17332c"/><rect y="1520" width="1080" height="400" fill="#1c1e26"/>
  <rect x="250" y="420" width="580" height="1100" fill="#14161c" stroke="${OL}" stroke-width="12"/>
  <g id="${id}I"><rect x="262" y="432" width="556" height="1088" fill="#fff3c0"/><rect x="262" y="1420" width="556" height="100" fill="#d9c890"/><rect x="262" y="432" width="556" height="1088" fill="url(#gLamp)" opacity=".6"/></g>
  <g id="${id}L"><rect x="262" y="432" width="278" height="1088" fill="#8a96a3" stroke="${OL}" stroke-width="6"/></g><g id="${id}R"><rect x="540" y="432" width="278" height="1088" fill="#8a96a3" stroke="${OL}" stroke-width="6"/></g>
  <rect x="440" y="300" width="200" height="90" rx="10" fill="#111" stroke="#333" stroke-width="6"/><text id="${id}N" x="540" y="368" font-family="JetBrains Mono" font-weight="800" font-size="64" text-anchor="middle" fill="#ff3b30">—</text>
  <g id="${id}S" transform="translate(540 900) rotate(-8)"><rect x="-200" y="-70" width="400" height="140" fill="#eadfbf" stroke="${OL}" stroke-width="6"/><text y="20" font-family="Montserrat" font-weight="900" font-size="56" text-anchor="middle" fill="#a01010">НЕ РАБОТАЕТ</text>
    <rect x="-230" y="-90" width="70" height="30" fill="#d9c890" opacity=".8" transform="rotate(-20 -195 -75)"/><rect x="160" y="-90" width="70" height="30" fill="#d9c890" opacity=".8" transform="rotate(20 195 -75)"/></g>
  <rect width="1080" height="1920" fill="url(#gVig)"/>`;
function build() {
  $("#a1").innerHTML = DEFS + journal("j1");
  $("#a2").innerHTML = DEFS + lift("l2") + `<g id="cb2" transform="translate(900 700)"><path d="M0 -300 V-40" stroke="#222" stroke-width="16"/><path d="M0 40 V300" stroke="#222" stroke-width="16"/><path d="M-30 -60 L30 -20 M-30 20 L30 60" stroke="#ffd23f" stroke-width="10"/></g>`;
  $("#a3").innerHTML = DEFS + lift("l3");
  $("#a4").innerHTML = DEFS + `<rect width="1080" height="1920" fill="#fff3c0"/><rect width="1080" height="1920" fill="url(#gLamp)" opacity=".5"/>
    <g transform="translate(540 960)"><rect x="-260" y="-520" width="520" height="1040" rx="30" fill="#b9c2cc" stroke="${OL}" stroke-width="14"/>
    ${Array.from({ length: 10 }, (_, i) => `<circle cx="${i % 2 ? 90 : -90}" cy="${-400 + Math.floor(i / 2) * 140}" r="48" fill="#8a96a3" opacity=".35"/>`).join("")}
    <circle cx="0" cy="150" r="80" fill="#2b2b2b" stroke="${OL}" stroke-width="10"/><circle id="bt4" cx="0" cy="150" r="62" fill="#c8242f"/></g><rect width="1080" height="1920" fill="url(#gVig)"/>`;
  $("#a5").innerHTML = DEFS + lobby() + `<g transform="translate(260 960)"><path d="M-60 0 Q-60 -40 0 -44 Q60 -40 60 0 Z" fill="#1a2640" stroke="${OL}" stroke-width="6"/><rect x="-80" y="-6" width="160" height="16" rx="8" fill="#111"/></g>
    <g transform="translate(400 1240)"><rect x="-70" y="-120" width="140" height="20" fill="#3a2c26"/><rect x="-60" y="-100" width="20" height="200" fill="#3a2c26"/><rect x="40" y="-100" width="20" height="200" fill="#3a2c26"/><rect x="-70" y="-260" width="20" height="160" fill="#3a2c26"/></g>
    <rect width="1080" height="1920" fill="#000" opacity=".45"/><rect width="1080" height="1920" fill="url(#gVig)"/>`;
  $("#a6").innerHTML = DEFS + `<rect width="1080" height="1920" fill="#0b0d14"/><g transform="translate(540 700)"><rect x="-220" y="-300" width="440" height="600" rx="30" fill="#b9c2cc" stroke="${OL}" stroke-width="14"/>
    <circle cx="0" cy="0" r="120" fill="#2b2b2b" stroke="${OL}" stroke-width="12"/><circle id="bt6" cx="0" cy="0" r="94" fill="#c8242f"/></g><rect width="1080" height="1920" fill="url(#gVig)"/>`;
}
const zoom = (sel, k, ox = 540, oy = 760) => { const e = $(sel); e.style.transformOrigin = `${ox}px ${oy}px`; e.style.transform = `scale(${k})`; };
const doors = (id, k) => { $(`#${id}L`).setAttribute("transform", `translate(${-270 * k} 0)`); $(`#${id}R`).setAttribute("transform", `translate(${270 * k} 0)`); };
const U = {
  s1(lt, t) { zoom("#a1", 1 + .03 * t, 540, 900); const h = $("#h1"); h.style.opacity = 1; h.style.transform = `scale(${1 + .02 * Math.sin(t * 5)})`; },
  s2(lt, t) { zoom("#a2", 1 + .02 * lt, 540, 900); doors("l2", 0); $("#cb2").setAttribute("opacity", t > 4.6 ? 1 : 0); },
  s3(lt, t) {
    zoom("#a3", 1 + .04 * lt, 540, 900); const n = $("#l3N"); n.textContent = t < 7.4 ? "—" : t < 8.0 ? "↓" : t < 8.6 ? "▼" : "?";
    doors("l3", easeInOut(prog(t, 8.9, 10.4))); $("#l3S").setAttribute("transform", `translate(${540 - 300 * easeInOut(prog(t, 8.9, 10.4))} 900) rotate(-8)`);
  },
  s4(lt, t) { zoom("#a4", lerp(1, 1.35, prog(t, 11.8, 17.8)), 540, 1110); $("#bt4").setAttribute("fill", Math.sin(t * 4) > 0 ? "#ff3b47" : "#a01010"); const b = $("#b4"); show(b, t, 16.2); if (t < 16.2) b.style.opacity = 0; },
  s5(lt, t) { zoom("#a5", 1 + .03 * lt, 400, 1100); },
  s6(lt, t) { $("#bt6").setAttribute("fill", Math.sin(t * 4) > 0 ? "#ff3b47" : "#a01010"); show($("#q6"), t, 21.65); show($("#b6"), t, 23.0); if (t < 23.0) $("#b6").style.opacity = 0; },
  s7(lt, t) { const s = $("#s6"); s.style.display = "block"; s.style.opacity = 1; U.s6(0, t); },
};
const UPD = {}; SCENES.forEach(({ id }) => { UPD[id] = (lt, t) => U[id](lt, t); });
function SOUND(sfx, add) {
  add(.2, (a) => sfx.noise(a, .4, "highpass", 3000, 1, .1, .05)); add(4.7, (a) => sfx.noise(a, .06, "highpass", 2500, 1, .3, .002));
  add(7.3, (a) => sfx.noise(a, 1.4, "lowpass", 160, 1, .45, .3)); add(8.6, sfx.ding); add(8.9, (a) => sfx.noise(a, 1.4, "bandpass", 500, 1, .2, .2));
  for (let t = 11.9; t < 17.8; t += .6) add(t, (a) => sfx.heart(a, .7)); add(16.2, sfx.boom); add(16.2, (a) => sfx.breath(a, 1)); add(17.9, (a) => sfx.wind(a, 3.6, .4)); add(21.7, sfx.ding);
}
ENGINE.start();
</script>
</body>
</html>
