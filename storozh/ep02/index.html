<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Правила ночного сторожа — Серия 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=JetBrains+Mono:wght@700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../survival/engine.css">
<style>
#stage{background:#0b0d14}
#clock{background:#c8242f;color:#fff;box-shadow:0 6px 0 #6a0f15;font-size:26px}
.full{transform-origin:540px 760px}
.ttl{position:absolute;left:30px;right:30px;text-align:center;font:900 76px/1.05 var(--head);color:#fff;z-index:6;
  text-shadow:6px 0 0 #000,-6px 0 0 #000,0 6px 0 #000,0 -6px 0 #000,5px 5px 0 #000,-5px 5px 0 #000,5px -5px 0 #000,-5px -5px 0 #000}
.ttl i{font-style:normal;color:#ffd23f}
.ep{position:absolute;left:40px;top:60px;background:#c8242f;color:#fff;font:900 36px var(--head);padding:10px 26px;border-radius:14px;z-index:6}
.card{position:absolute;left:70px;right:70px;height:180px;border-radius:30px;background:rgba(18,20,30,.92);border:3px solid #3a3f52;display:flex;align-items:center;gap:30px;padding:0 30px;z-index:6;color:#fff}
.card .n{flex:none;width:120px;height:120px;border-radius:24px;display:flex;align-items:center;justify-content:center;font:900 80px var(--head)}
.card b{display:block;font:900 50px/1.05 var(--head)} .card span{display:block;font:800 34px var(--head);color:#9fb4c8;margin-top:8px}
.note{position:absolute;left:110px;right:110px;top:300px;min-height:640px;padding:50px 46px;background:#eadfbf;color:#1f2a44;font:700 72px/1.2 Caveat;z-index:6;box-shadow:0 20px 40px rgba(0,0,0,.7);transform:rotate(-2deg);
  background-image:repeating-linear-gradient(transparent 0 84px,#9cb4c9 84px 86px)}
.note .r{color:#8a1010}
.bub{position:absolute;left:0;right:0;margin:auto;width:max-content;max-width:900px;padding:22px 40px;border-radius:50px;background:#fff;color:#111;font:900 58px var(--head);z-index:7;border:6px solid #000;text-align:center}
.bub i{font-style:italic;font-weight:800}
.bdg{position:absolute;left:0;right:0;margin:auto;width:max-content;padding:14px 30px;border-radius:18px;font:900 46px var(--head);z-index:7;border:5px solid #000}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><div id="cam">
  <div class="scene" id="s1"><svg class="full" width="1080" height="1920" viewBox="0 0 1080 1920" id="a1"></svg>
    <div class="ep">СЕРИЯ 2</div><div class="ttl" id="h1" style="top:170px">ВЫ ВЫБРАЛИ:<br><i>ВЫКЛЮЧИТЬ ФОНАРЬ</i></div></div>
  <div class="scene" id="s2"><svg class="full" width="1080" height="1920" viewBox="0 0 1080 1920" id="a2"></svg></div>
  <div class="scene" id="s3"><svg class="full" width="1080" height="1920" viewBox="0 0 1080 1920" id="a3"></svg></div>
  <div class="scene" id="s4"><svg class="full" width="1080" height="1920" viewBox="0 0 1080 1920" id="a4"></svg>
    <div class="note" id="n4"><span id="n4a"></span><br><span id="n4b" class="r"></span><br><span id="n4c"></span></div></div>
  <div class="scene" id="s5"><svg class="full" width="1080" height="1920" viewBox="0 0 1080 1920" id="a5"></svg>
    <div class="bub" id="b5a" style="top:140px"><i>«…»</i></div><div class="bub" id="b5b" style="top:140px"><i>«Сынок, ты здесь?»</i></div></div>
  <div class="scene" id="s6"><svg class="full" width="1080" height="1920" viewBox="0 0 1080 1920" id="a6"></svg>
    <div class="ttl" id="q6" style="top:240px">ЧТО МНЕ <i>ДЕЛАТЬ?</i></div>
    <div class="card" id="c6a" style="top:470px"><div class="n" style="background:#c8242f">1</div><div><b>ОТВЕТИТЬ 🗣</b><span>это же мама…</span></div></div>
    <div class="card" id="c6b" style="top:690px"><div class="n" style="background:#2f6fd6">2</div><div><b>ЗАПЕРЕТЬ ПОДВАЛ 🔒</b><span>молча</span></div></div>
    <div class="bdg" id="b6a" style="top:930px;background:#fff;color:#111">💬 ПИШИ ЦИФРУ В КОММЕНТЫ</div>
    <div class="bdg" id="b6b" style="top:1060px;background:#c8242f;color:#fff">СЕРИЯ 3 — РЕШАЕШЬ ТЫ</div></div>
  <div class="scene" id="s7"></div>
</div></div></div>

<script src="../../survival/engine.js"></script>
<script src="../common.js"></script>
<script>
"use strict";
const DUR = 36.9;
// Растяжка таймлайна под озвучку: пары [время сценария, время видео]. Строку генерирует tools/make-voice.py
const WARP = [[0, 0.00], [0.1, 0.10], [2.6, 3.03], [6, 6.74], [8.8, 9.65], [10.8, 11.46], [12.2, 12.75], [14.6, 15.06], [17.6, 17.98], [18.8, 19.02], [20.6, 20.61], [22.6, 22.58], [24.4, 24.42], [27, 26.83], [28.8, 28.44], [30, 29.59], [31.2, 31.08], [33.8, 33.77], [35.2, 35.46], [36.6, 36.74], [36.9, 37.04]];
const SCENES = [
  { id: "s1", s: 0, e: 6.0 }, { id: "s2", s: 6.0, e: 12.2 }, { id: "s3", s: 12.2, e: 17.6 }, { id: "s4", s: 17.6, e: 24.4 },
  { id: "s5", s: 24.4, e: 28.8 }, { id: "s6", s: 28.8, e: 36.6 }, { id: "s7", s: 36.6, e: 36.9 },
];
const SPEAK = [];
const DROP = ["подписывайся"];
const SHAKES = [10.8, 27.0];
const FLASHES = [];
const clockText = (t) => (t >= 6.0 && t < 28.8 ? "ПРАВИЛА НОЧНОГО СТОРОЖА · СЕРИЯ 2" : null);
const CAPS = [
  [0.1, "Вы выбрали: {y:выключить фонарь и уйти.}"],
  [2.6, "Я щёлкнул кнопкой,"],
  [3.73, "и коридор {r:провалился в темноту.}"],
  [6, "Я пошёл назад, к вахте,"],
  [7.58, "и считал шаги."],
  [8.8, "А сзади {r:кто-то шёл за мной.}"],
  [10.8, "{r:Шаг в шаг.}"],
  [12.2, "Я добежал до вахты и {y:включил свет.}"],
  [14.6, "На столе лежал листок,"],
  [15.84, "которого раньше не было."],
  [17.6, "Тот же почерк:"],
  [18.8, "«Правильно, что не посветил."],
  [20.6, "Но теперь {r:оно идёт за тобой.}"],
  [22.6, "Помни {y:правило номер три».}"],
  [24.4, "И тут {r:из подвала} меня позвали по имени."],
  [27, "{r:Голосом моей мамы.}"],
  [28.8, "Что мне делать?"],
  [30, "{y:Один} — ответить."],
  [31.2, "{y:Два} — молча запереть дверь в подвал."],
  [33.8, "Пиши {y:цифру} в комменты."],
  [35.2, "Решать тебе."],
  [36.6, ""]
];
const MUSIC = { bpm: 60, root: 41, parts: [[0, 28.8, "pad", .6], [28.8, 36.9, "pad", .35]] };

const GB = { label: "ОХРАНА", torch: 1 };
const GX = 420, GY = 2060, GS = 1.25;
const tipOf = (hx, hy, ang) => { const a = ang * Math.PI / 180, lx = hx + 8 + 60 * Math.sin(a), ly = hy - 16 - 60 * Math.cos(a); return [GX + lx * GS, GY + ly * GS]; };
const zoom = (sel, k, ox = 540, oy = 760) => { const e = $(sel); e.style.transformOrigin = `${ox}px ${oy}px`; e.style.transform = `scale(${k})`; };
const flick = (t, wins) => wins.some(([a, b]) => t >= a && t < b);
const N1 = "Правильно, что не посветил.", N2 = "Но теперь оно идёт за тобой.", N3 = "Помни правило №3.";
// вспышки лампы в сцене 2 и глубина фигуры на каждой вспышке
const FL2 = [[7.0, 7.12, 12.5], [8.9, 9.05, 9.5], [9.8, 9.95, 7.0], [10.8, 11.0, 4.6], [11.6, 11.75, 3.2]];
function build() {
  const guard = (id) => `<g transform="translate(${GX} ${GY}) scale(${GS})">${personBack(id, GB)}</g>`;
  $("#a1").innerHTML = DEFS + corridor("c1", { beam: 1 }) + `<rect id="dk1" width="1080" height="1920" fill="#000" opacity="0"/><rect width="1080" height="1920" fill="url(#gVig)"/>` + guard("g1");
  $("#a2").innerHTML = DEFS + corridor("c2") + `<g id="fg2"></g><rect id="dk2" width="1080" height="1920" fill="#000" opacity=".7"/><rect width="1080" height="1920" fill="url(#gVig)"/><g id="w2">${guardFront("gf2", "f2", { free: 1 })}</g>`;
  $("#a3").innerHTML = DEFS + lobby() + `<g transform="translate(250 972) rotate(-6)"><rect x="-60" y="-14" width="120" height="28" fill="#eadfbf" stroke="${OL}" stroke-width="4"/></g><ellipse id="gl3" cx="250" cy="972" rx="110" ry="40" fill="#fff4cc" opacity="0"/>
    <g transform="translate(720 1640) scale(.95)">${guardFront("gf3", "f3", { free: 1 })}</g><rect id="dk3" width="1080" height="1920" fill="#000" opacity=".85"/>`;
  $("#a4").innerHTML = DEFS + desk + `<rect width="1080" height="1920" fill="#000" opacity=".25"/>`;
  $("#a5").innerHTML = DEFS + `<rect width="1080" height="1920" fill="#232a36"/><rect y="1180" width="1080" height="740" fill="#1c1e26"/><rect y="760" width="1080" height="420" fill="#17332c"/>
    <g stroke="${OL}" stroke-width="8"><rect x="300" y="420" width="480" height="760" fill="#000"/><g id="dr5"><path d="M300 420 L560 470 L560 1140 L300 1180 Z" fill="#3a2c26"/><circle cx="520" cy="820" r="14" fill="#8a7a5a"/></g>
    <rect x="390" y="320" width="300" height="80" rx="8" fill="#c9c2a8"/><text x="540" y="378" font-family="Montserrat" font-weight="900" font-size="48" text-anchor="middle" fill="#7a2020" stroke="none">ПОДВАЛ</text></g>
    ${[0, 1, 2, 3].map((i) => `<rect x="${600 + i * 18}" y="${1100 - i * 120}" width="${170 - i * 36}" height="16" fill="#14161c"/>`).join("")}
    <ellipse id="gw5" cx="680" cy="800" rx="160" ry="380" fill="#9fb4c8" opacity="0"/><rect width="1080" height="1920" fill="url(#gVig)"/>`;
  $("#a6").innerHTML = DEFS + `<g filter="url(#fBlur)">${corridor("c6")}</g><rect width="1080" height="1920" fill="#05060a" opacity=".6"/>`;
  ["c2", "c6"].forEach((c) => $(`#${c}F`).setAttribute("opacity", 0));
}
const U = {
  s1(lt, t) {
    zoom("#a1", 1 + .02 * t); setArm("g1", 131, -226, 160, -276, 28); const [tx, ty] = tipOf(160, -276, 28);
    const off = t > 2.8; setBeam("c1", tx, ty, .15, .35, off ? 0 : 1);
    $("#dk1").setAttribute("opacity", off ? .55 + .05 * Math.sin(t * 3) : 0); $("#c1L").setAttribute("opacity", off ? 0 : flick(t, [[1.2, 1.28]]) ? 0 : 1);
    $("#c1F").setAttribute("opacity", off ? 0 : 1);
    const h = $("#h1"); h.style.opacity = 1; h.style.transform = `scale(${1 + .02 * Math.sin(t * 5)})`;
  },
  s2(lt, t) {
    const k = prog(t, 6.0, 12.2), sc = lerp(.55, 1.05, k);
    $("#w2").setAttribute("transform", `translate(${540 + 10 * Math.sin(t * 7)} ${lerp(1260, 1880, k) - Math.abs(Math.sin(t * 7)) * 12}) scale(${sc})`);
    setFace("f2", t < 8.8 ? "calm" : "fear", Math.sin(t * 2) * .6);
    const w = FL2.find(([a, b]) => t >= a && t < b); $("#c2L").setAttribute("opacity", w ? 1 : 0); $("#dk2").setAttribute("opacity", w ? .15 : .7);
    $("#fg2").innerHTML = w ? figure(.3, w[2]) : "";
  },
  s3(lt, t) {
    zoom("#a3", 1 + .02 * lt, 400, 1100); const on = t > 13.6 && !flick(t, [[13.7, 13.8], [13.9, 13.95]]);
    $("#dk3").setAttribute("opacity", on ? 0 : .85); setFace("f3", t < 14.6 ? "fear" : "shock", -1);
    $("#gl3").setAttribute("opacity", t > 14.6 ? .3 + .2 * Math.sin(t * 5) : 0);
  },
  s4(lt, t) {
    const n = $("#n4"), p = easeOut(prog(t, 17.65, 18.1)); n.style.opacity = p; n.style.transform = `rotate(-2deg) scale(${.85 + .15 * p})`;
    const ty = (el, s, a, b) => ($("#" + el).textContent = s.slice(0, Math.floor(s.length * prog(t, a, b))));
    ty("n4a", N1, 18.8, 20.3); ty("n4b", N2, 20.6, 22.2); ty("n4c", N3, 22.6, 23.8); zoom("#a4", 1 + .03 * lt);
  },
  s5(lt, t) {
    zoom("#a5", lerp(1, 1.25, prog(t, 24.4, 28.8)), 520, 800);
    $("#dr5").setAttribute("transform", `translate(${-12 * Math.sin(t * 1.5)} 0)`); $("#gw5").setAttribute("opacity", t > 27.0 ? .12 + .06 * Math.sin(t * 9) : 0);
    const a = $("#b5a"), b = $("#b5b"); show(a, t, 25.4); if (t < 25.4 || t > 27.0) a.style.opacity = 0; show(b, t, 27.0); if (t < 27.0) b.style.opacity = 0;
  },
  s6(lt, t) {
    show($("#q6"), t, 28.85); show($("#c6a"), t, 30.0, .3, 60); show($("#c6b"), t, 31.2, .3, 60); show($("#b6a"), t, 33.8); show($("#b6b"), t, 35.2);
    if (t < 30.0) $("#c6a").style.opacity = 0; if (t < 31.2) $("#c6b").style.opacity = 0; if (t < 33.8) $("#b6a").style.opacity = 0; if (t < 35.2) $("#b6b").style.opacity = 0;
  },
  s7(lt, t) { const s = $("#s6"); s.style.display = "block"; s.style.opacity = 1; U.s6(0, t); },
};
const UPD = {}; SCENES.forEach(({ id }) => { UPD[id] = (lt, t) => U[id](lt, t); });
function SOUND(sfx, add) {
  const buzz = (a) => sfx.noise(a, .07, "highpass", 2500, 1, .12, .002), click = (a) => sfx.noise(a, .04, "highpass", 1500, 1, .35, .002);
  const step = (a, v = .3) => sfx.noise(a, .07, "lowpass", 260, 1, v, .005);
  add(1.2, buzz); add(2.8, click); add(2.85, sfx.whooshDown);
  for (let t = 6.1; t < 12.2; t += .5) { add(t, (a) => step(a)); if (t > 8.8) add(t + .12, (a) => step(a, .22)); }
  FL2.forEach(([a]) => add(a, buzz)); add(10.8, sfx.hit); for (let t = 9.0; t < 12.2; t += .45) add(t, (a) => sfx.heart(a, .8));
  add(13.6, click); add(13.7, buzz); add(14.6, sfx.hit); add(17.65, (a) => sfx.noise(a, .3, "highpass", 3000, 1, .12, .05));
  for (let t = 18.9; t < 23.8; t += .18) add(t, (a) => sfx.noise(a, .05, "bandpass", 3500, 3, .05, .01));
  add(24.4, sfx.whooshDown); add(25.4, (a) => sfx.breath(a, 1.0)); add(27.0, sfx.boom); add(27.0, sfx.hit);
  [30.0, 31.2].forEach((t) => add(t, sfx.ding)); [33.8, 35.2].forEach((t) => add(t, sfx.pop));
}
ENGINE.start();
</script>
</body>
</html>
