<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=JetBrains+Mono:wght@700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">

<body>
<div id="wrap"><div id="stage"><div id="cam">
  <div class="scene" id="s1"><svg class="full" width="1080" height="1920" viewBox="0 0 1080 1920" id="a1"></svg>
    <div class="ep">ЗАПИСКИ ПРОШЛОГО СТОРОЖА · №1</div><div class="ttl" id="h1" style="top:170px">ПРАВИЛО №4:<br><i>В 3:15 НЕ СМОТРИ В ОКНА</i></div></div>
  <div class="scene" id="s2"><svg class="full" width="1080" height="1920" viewBox="0 0 1080 1920" id="a2"></svg></div>
  <div class="scene" id="s3"><svg class="full" width="1080" height="1920" viewBox="0 0 1080 1920" id="a3"></svg>

  <div class="scene" id="s4"><svg class="full" width="1080" height="1920" viewBox="0 0 1080 1920" id="a4"></svg></div>
  <div class="scene" id="s5"><svg class="full" width="1080" height="1920" viewBox="0 0 1080 1920" id="a5"></svg>

    <div class="ttl" id="q5" style="top:1060px;font-size:70px">А ТЫ БЫ <i>ОБЕРНУЛСЯ?</i></div>
    <div class="bdg" id="b5" style="top:1200px;background:#fff;color:#111">💬 ПИШИ В КОММЕНТЫ</div></div>

</div></div></div>

<script src="../../survival/engine.js"></script>

<script>
"use strict";
const DUR = 27.7;
// Растяжка таймлайна под озвучку: пары [время сценария, время видео]. Строку генерирует tools/make-voice.py
const WARP = [[0, 0.00], [0.1, 0.10], [2.6, 2.70], [5.2, 5.57], [6.2, 7.23], [8.8, 9.39], [11, 12.45], [12, 13.67], [13.6, 15.51], [14.8, 17.08], [16.6, 19.13], [18.6, 21.39], [21.4, 25.21], [23.2, 26.85], [24.8, 28.45], [26, 29.78], [27.4, 31.02], [27.7, 31.32]];
const SCENES = [
  { id: "s1", s: 0, e: 5.2 }, { id: "s2", s: 5.2, e: 11.0 }, { id: "s3", s: 11.0, e: 16.6 }, { id: "s4", s: 16.6, e: 23.2 },
  { id: "s5", s: 23.2, e: 27.4 }, { id: "s6", s: 27.4, e: 27.7 },
];
const SPEAK = [];
const DROP = ["подписывайся"];
const SHAKES = [13.7, 14.1, 14.5];
const FLASHES = [];
const clockText = (t) => (t >= 5.2 && t < 23.2 ? "ЗАПИСКИ ПРОШЛОГО СТОРОЖА · №1" : null);
const CAPS = [
  [0.1, "Под столом на вахте я нашёл {y:старый журнал.}"],
  [2.6, "Последние записи — {y:почерком прошлого сторожа.}"],
  [5.2, "«Ночь третья."],
  [6.2, "В три пятнадцать {r:за окнами кто-то ходит.}"],
  [8.8, "Я знаю правило: {y:не смотреть в окна.}"],
  [11, "Но оно {r:стучит.}"],
  [12, "Тихо, вежливо, как сосед."],
  [13.6, "{r:Ровно три раза.}"],
  [14.8, "Сегодня оно {r:назвало моё имя.}"],
  [16.6, "Я сижу спиной к окну и пишу это."],
  [18.6, "Стекло запотело изнутри,"],
  [19.94, "хотя в комнате холодно."],
  [21.4, "{r:Если я сейчас обернусь…»}"],
  [23.2, "Дальше {r:страница вырвана.}"],
  [24.8, "А ты бы обернулся?"],
  [26, "Пиши в комменты."],
  [27.4, ""]
];
const MUSIC = { bpm: 60, root: 41, parts: [[0, 27.7, "pad", .6]] };
// окно ночью: стекло, луна, силуэт снаружи, туман и отпечаток ладони
const win = (id, x = 290, y = 380, w = 500, h = 640) => `<defs><clipPath id="${id}c"><rect x="${x}" y="${y}" width="${w}" height="${h}"/></clipPath></defs>
  <rect x="${x - 30}" y="${y - 30}" width="${w + 60}" height="${h + 60}" fill="#c9c2a8" stroke="${OL}" stroke-width="10"/>
  <g clip-path="url(#${id}c)"><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#0d1a33"/><circle cx="${x + w * .75}" cy="${y + 120}" r="46" fill="#e8f0ff"/><circle cx="${x + w * .75}" cy="${y + 120}" r="120" fill="url(#gMoon)"/>
    ${Array.from({ length: 5 }, (_, i) => `<path d="M${x + i * 110} ${y + h} l50 -260 l50 260Z" fill="#06101e"/>`).join("")}
    <g id="${id}S"><path d="M0 0 V-330 Q0 -420 60 -430 Q120 -420 120 -330 V0Z" fill="#000"/><circle cx="40" cy="-380" r="7" fill="#fff"/><circle cx="80" cy="-380" r="7" fill="#fff"/></g>
    <g id="${id}H" opacity="0"><ellipse cx="${x + w * .45}" cy="${y + h * .45}" rx="50" ry="62" fill="#fff" opacity=".5"/>${[-36, -14, 8, 30].map((dx, i) => `<rect x="${x + w * .45 + dx - 9}" y="${y + h * .45 - 130 + (i % 3) * 6}" width="18" height="70" rx="9" fill="#fff" opacity=".5"/>`).join("")}</g>
    <rect id="${id}F" x="${x}" y="${y}" width="${w}" height="${h}" fill="#dfe8f0" opacity="0"/></g>
  <path d="M${x + w / 2} ${y} V${y + h} M${x} ${y + h / 2} H${x + w}" stroke="#c9c2a8" stroke-width="22"/>`;
const wall = `<rect width="1080" height="1920" fill="#262c3a"/><rect y="1100" width="1080" height="820" fill="#17332c"/><rect y="1096" width="1080" height="8" fill="#0e1f1a"/>`;
const clockDig = (id) => `<g transform="translate(150 260)"><rect x="-110" y="-50" width="220" height="100" rx="14" fill="#111" stroke="#333" stroke-width="6"/><text id="${id}" y="28" font-family="JetBrains Mono" font-size="70" text-anchor="middle" fill="#ff3b30">3:14</text></g>`;
function build() {
  $("#a1").innerHTML = DEFS + journal("j1");
  $("#a2").innerHTML = DEFS + wall + win("w2") + clockDig("cd2") + `<rect width="1080" height="1920" fill="url(#gVig)"/>`;
  $("#a3").innerHTML = DEFS + wall + win("w3", 190, 300, 700, 820) + `<rect width="1080" height="1920" fill="url(#gVig)"/>`;
  $("#a4").innerHTML = DEFS + wall + win("w4", 240, 260, 600, 700) + `<g transform="translate(540 1640) scale(1.05)">${guardFront("og4", "of4", { free: 1 })}</g>
    <rect x="80" y="1300" width="920" height="60" fill="#5a3d2c" stroke="${OL}" stroke-width="8"/><rect x="120" y="1360" width="840" height="560" fill="#4a3022" stroke="${OL}" stroke-width="8"/>
    <g transform="translate(560 1290) rotate(-4)"><rect x="-120" y="-30" width="240" height="40" fill="#eadfbf" stroke="${OL}" stroke-width="5"/></g><rect width="1080" height="1920" fill="url(#gVig)"/>`;
  $("#a5").innerHTML = DEFS + torn;
  makeOld("og4");
}
const zoom = (sel, k, ox = 540, oy = 760) => { const e = $(sel); e.style.transformOrigin = `${ox}px ${oy}px`; e.style.transform = `scale(${k})`; };
const U = {
  s1(lt, t) { zoom("#a1", 1 + .03 * t, 540, 900); const h = $("#h1"); h.style.opacity = 1; h.style.transform = `scale(${1 + .02 * Math.sin(t * 5)})`; },
  s2(lt, t) {
    zoom("#a2", 1 + .03 * lt); $("#cd2").textContent = t < 6.2 ? "3:14" : "3:15"; $("#cd2").setAttribute("opacity", Math.sin(t * 6) > -.3 ? 1 : .3);
    const k = prog(t, 6.4, 9.6); $("#w2S").setAttribute("transform", `translate(${lerp(200, 840, k)} 1020)`);
  },
  s3(lt, t) {
    zoom("#a3", 1 + .04 * lt); const kn = [12.0, 12.4, 12.8, 13.7, 14.1, 14.5].some((k) => t > k && t < k + .12);
    $("#w3S").setAttribute("transform", `translate(${470 + (kn ? 6 : 0)} 1120) scale(1.4)`);
    const b = $("#b3"); show(b, t, 14.8); if (t < 14.8) b.style.opacity = 0;
  },
  s4(lt, t) {
    zoom("#a4", 1 + .04 * lt, 540, 900); setFace("of4", t > 21.4 ? "shock" : "fear", .6);
    $("#w4F").setAttribute("opacity", .6 * prog(t, 18.6, 21.0)); $("#w4H").setAttribute("opacity", t > 20.2 ? 1 : 0);
    $("#w4S").setAttribute("transform", `translate(${lerp(260, 470, prog(t, 20.0, 22.6))} ${960 + 40}) scale(1.2)`);
  },
  s5(lt, t) {
    show($("#t5"), t, 23.25); show($("#q5"), t, 24.8); if (t < 24.8) $("#q5").style.opacity = 0; show($("#b5"), t, 26.0); if (t < 26.0) $("#b5").style.opacity = 0;
  },
  s6(lt, t) { const s = $("#s5"); s.style.display = "block"; s.style.opacity = 1; U.s5(0, t); },
};
const UPD = {}; SCENES.forEach(({ id }) => { UPD[id] = (lt, t) => U[id](lt, t); });
function SOUND(sfx, add) {
  const knock = (a) => sfx.noise(a, .07, "bandpass", 900, 3, .55, .003);
  add(.2, (a) => sfx.noise(a, .4, "highpass", 3000, 1, .1, .05)); add(5.3, (a) => sfx.wind(a, 5.6, .5)); for (let t = 6.5; t < 9.6; t += .6) add(t, (a) => sfx.noise(a, .08, "lowpass", 300, 1, .25, .01));
  [12.0, 12.4, 12.8, 13.7, 14.1, 14.5].forEach((t) => add(t, knock)); add(14.8, (a) => sfx.breath(a, 1.2));
  for (let t = 16.8; t < 23.2; t += .6) add(t, (a) => sfx.heart(a, .7)); add(20.2, sfx.hit); add(21.4, (a) => sfx.riser(a, 1.6)); add(23.2, (a) => sfx.noise(a, .5, "highpass", 2000, 1, .3, .01, 600)); add(24.8, sfx.ding);
}
ENGINE.start();
</script>
</body>
</html>
