<script>

const WARP = [[0, 0], [25.3, 25.3]];
const SCENES = [{ id: "s1", s: 0, e: 6.0 }, { id: "s2", s: 6.0, e: 13.4 }, { id: "s3", s: 13.4, e: 16.2 }, { id: "s4", s: 16.2, e: 21.0 }, { id: "s5", s: 21.0, e: 25.0 }, { id: "s6", s: 25.0, e: 25.3 }];
const SPEAK = [];
const DROP = ["подписывайся"];
const SHAKES = [13.4], FLASHES = [];
const clockText = (t) => (t >= 6.0 && t < 21.0 ? "ЗАПИСКИ ПРОШЛОГО СТОРОЖА · №13" : null);
const CAPS = [
  [0.1, "Ещё одна запись из журнала."],

const MUSIC = { bpm: 60, root: 41, parts: [[0, 25.3, "pad", .6]] };
const SC = {"2": {"t": "lobby", "pr": [["📝", 300, 950, 140, 0, "blink"]], "tx": [["«НЕ ОБОРАЧИВАЙСЯ»", 1150, 64, "#ff3b30", 4.8, 0]]}, "3": {"t": "dark", "bg": "#05060a", "pr": [["👁", 540, 860, 300, 0.2, "blink"]]}, "4": {"t": "dark", "bg": "#05060a", "pr": [["📝", 540, 700, 300, 0]], "tx": [["«ЗАВТРА — БЛИЖЕ»", 1080, 85, "#ff3b30", 2.8, 0]]}};

const zoom = (sel, k, ox = 540, oy = 760) => { const e = $(sel); e.style.transformOrigin = `${ox}px ${oy}px`; e.style.transform = `scale(${k})`; };
const dclock = (id) => `<g transform="translate(540 760)"><rect x="-260" y="-100" width="520" height="200" rx="20" fill="#111" stroke="#333" stroke-width="10"/><text id="${id}" y="58" font-family="JetBrains Mono" font-size="150" text-anchor="middle" fill="#ff3b30"></text></g>`;
const prints = (id) => `<g id="${id}">${Array.from({ length: 8 }, (_, i) => `<g class="fp" opacity="0" transform="translate(${540 + (i % 2 ? 60 : -60)} ${980 + i * 110}) scale(${.5 + i * .09})"><ellipse rx="34" ry="56" fill="#3a6a8a" opacity=".7"/>${[0, 1, 2, 3, 4].map((k) => `<circle cx="${-24 + k * 12}" cy="-66" r="8" fill="#3a6a8a" opacity=".7"/>`).join("")}</g>`).join("")}</g>`;
function zHTML(k, z) {
  let s = DEFS;
  if (z.t === "dark") s += `<rect width="1080" height="1920" fill="${z.bg || "#030306"}"/>`;
  if (z.t === "clock") s += `<rect width="1080" height="1920" fill="#030306"/>` + dclock("ck" + k);

  if (z.t === "window") s += `<rect width="1080" height="1920" fill="#232a36"/><rect y="1180" width="1080" height="740" fill="#17332c"/>` + nightWin("w" + k);
  if (z.t === "door") s += cellarDoor("d" + k);
  if (z.t === "lobby") s += lobby();
  if (z.t === "exterior") s += exterior("x" + k);
  if (z.t === "wallclock") s += wallClock("k" + k);
  if (z.back) s += z.back;
  (z.pr || []).forEach((p, i) => (s += `<text id="zp${k}_${i}" x="${p[1]}" y="${p[2]}" font-size="${p[3]}" text-anchor="middle" dominant-baseline="central" opacity="0">${[...p[0]].length === 1 ? p[0] + "\uFE0F" : p[0]}</text>`));
  (z.tx || []).forEach((x, i) => (s += `<text id="zt${k}_${i}" x="540" y="${x[1]}" font-family="Montserrat" font-weight="900" font-size="${x[2]}" text-anchor="middle" fill="${x[3] || "#fff"}" opacity="0">${x[0]}</text>`));
  if (z.t !== "dark" && z.t !== "clock") s += `<rect width="1080" height="1920" fill="url(#gVig)"/>`;
  s += `<rect id="zf${k}" width="1080" height="1920" fill="#000" opacity="0"/>`;
  return s;
}
function zUpd(k, z, lt, t, t0) {
  const q = (a) => t0 + a;
  zoom("#a" + k, 1 + .03 * lt + (z.push ? .2 * prog(lt, z.push, z.push + 2) : 0), 540, z.oy || 900);
  if (z.t === "clock") $("#ck" + k).textContent = lt < (z.at || 0.6) ? z.c[0] : z.c[1];
  if (z.t === "corridor" || z.t === "prints") { const f = $("#c" + k + "F"); const v = z.fig ? (lt >= z.fig[0] && lt < z.fig[1] ? 1 : 0) : 0; f.setAttribute("opacity", z.flick && v ? (Math.sin(t * 40) > -.3 ? 1 : 0) : v);
    setBeam("c" + k, 540, 1150, z.aim === undefined ? .3 + .05 * Math.sin(t) : z.aim, .35, z.off && lt >= z.off ? 0 : 1); }
  if (z.t === "prints") $$("#fp" + k + " .fp").forEach((f, i) => f.setAttribute("opacity", prog(lt, (z.pa || .2) + i * .3, (z.pa || .2) + .3 + i * .3)));
  if (z.t === "window") { $("#w" + k + "S").setAttribute("transform", `translate(${lerp(z.sx ? z.sx[0] : 200, z.sx ? z.sx[1] : 600, prog(lt, 0, 3))} 1020)`); $("#w" + k + "H").setAttribute("opacity", z.hand !== undefined && lt >= z.hand ? 1 : 0); }
  if (z.t === "door") { $("#d" + k + "G").setAttribute("opacity", z.glow !== undefined ? .7 * prog(lt, z.glow, z.glow + .6) : 0); $("#d" + k + "C").setAttribute("opacity", z.scr !== undefined && lt >= z.scr ? 1 : 0);
    $("#d" + k + "D").setAttribute("transform", z.knock && lt >= z.knock ? `translate(${4 * Math.sin(t * 50)} 0)` : ""); }
  if (z.t === "exterior") { const w = $("#x" + k + "W"); if (w) w.setAttribute("opacity", z.win !== undefined && lt >= z.win ? 1 : 0); }
  if (z.t === "wallclock") { const m = z.hm || [3, 0]; const mm = m[1] + lt * (z.spd || 1); $("#k" + k + "H").setAttribute("transform", `rotate(${(m[0] % 12) * 30 + mm * .5})`); $("#k" + k + "M").setAttribute("transform", `rotate(${mm * 6})`); $("#k" + k + "S").setAttribute("transform", `rotate(${lt * 360})`); }
  (z.pr || []).forEach((p, i) => { const e = $(`#zp${k}_${i}`); e.setAttribute("opacity", lt >= (p[4] || 0) ? (p[5] === "blink" ? (Math.sin(t * 12) > 0 ? 1 : .3) : 1) : 0); });
  (z.tx || []).forEach((x, i) => { const e = $(`#zt${k}_${i}`); e.setAttribute("opacity", lt >= x[4] ? 1 - .5 * prog(lt, x[4] + 1, x[4] + 2) * (x[5] ? 1 : 0) : 0); });
  $("#zf" + k).setAttribute("opacity", z.black !== undefined && lt >= z.black ? 1 : 0);
}

function build() {
  $("#a1").innerHTML = DEFS + journal("j1");
  ["2", "3", "4"].forEach((k) => ($("#a" + k).innerHTML = zHTML(k, SC[k])));
  $("#a5").innerHTML = DEFS + torn;
}
const U = {
  s1(lt, t) { zoom("#a1", 1 + .03 * t, 540, 900); const h = $("#h1"); h.style.opacity = 1; h.style.transform = `scale(${1 + .02 * Math.sin(t * 5)})`; },

  s3(lt, t) { zUpd("3", SC["3"], lt, t, 13.4); },
  s4(lt, t) { zUpd("4", SC["4"], lt, t, 16.2); },
  s5(lt, t) { show($("#t5"), t, 21.05); show($("#q5"), t, 21.05); show($("#b5"), t, 22.6); if (t < 22.6) $("#b5").style.opacity = 0; },
  s6(lt, t) { const s = $("#s5"); s.style.display = "block"; s.style.opacity = 1; U.s5(0, t); },

const UPD = {}; SCENES.forEach(({ id }) => { UPD[id] = (lt, t) => U[id](lt, t); });
function SOUND(sfx, add) {
  add(.2, (a) => sfx.noise(a, .4, "highpass", 3000, 1, .1, .05));
  add(10.8, sfx.hit); add(13.4, sfx.breath); add(14.4, sfx.breath); add(19, sfx.boom);
  add(21.0, (a) => sfx.noise(a, .5, "highpass", 2000, 1, .3, .01, 600)); add(22.6, sfx.ding);
}
