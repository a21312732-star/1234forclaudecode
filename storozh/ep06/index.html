<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Правила ночного сторожа — Серия 6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=JetBrains+Mono:wght@700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../survival/engine.css">
<style>
.card{position:absolute;left:70px;right:70px;height:180px;border-radius:30px;background:rgba(18,20,30,.92);border:3px solid #3a3f52;display:flex;align-items:center;gap:30px;padding:0 30px;z-index:6;color:#fff}
.card .n{flex:none;width:120px;height:120px;border-radius:24px;display:flex;align-items:center;justify-content:center;font:900 80px var(--head)}
.card b{display:block;font:900 50px/1.05 var(--head)} .card span{display:block;font:800 34px var(--head);color:#9fb4c8;margin-top:8px}
.say{position:absolute;left:90px;right:90px;top:300px;z-index:6;text-align:center;font:900 76px/1.1 var(--head);color:#ff3b47;text-shadow:0 0 30px rgba(255,40,40,.6);opacity:0}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><div id="cam">
  <div class="scene" id="s1"><svg class="full" width="1080" height="1920" viewBox="0 0 1080 1920" id="a1"></svg>
    <div class="ep">СЕРИЯ 6</div><div class="ttl" id="h1" style="top:170px">ВЫ ВЫБРАЛИ:<br><i>ПОЗВОНИТЬ ☎</i></div></div>
  <div class="scene" id="s2"><svg class="full" width="1080" height="1920" viewBox="0 0 1080 1920" id="a2"></svg></div>
  <div class="scene" id="s3"><svg class="full" width="1080" height="1920" viewBox="0 0 1080 1920" id="a3"></svg>
    <div class="say" id="sy3">«НЕ СПУСКАЙСЯ<br>В ПОДВАЛ»</div></div>
  <div class="scene" id="s4"><svg class="full" width="1080" height="1920" viewBox="0 0 1080 1920" id="a4"></svg></div>
  <div class="scene" id="s5"><svg class="full" width="1080" height="1920" viewBox="0 0 1080 1920" id="a5"></svg>
    <div class="ttl" id="q5" style="top:240px">ЧТО МНЕ <i>ДЕЛАТЬ?</i></div>
    <div class="card" id="c5a" style="top:470px"><div class="n" style="background:#c8242f">1</div><div><b>ОТВЕТИТЬ ☎</b><span>звонок из подвала</span></div></div>
    <div class="card" id="c5b" style="top:690px"><div class="n" style="background:#2f6fd6">2</div><div><b>ВЫДЕРНУТЬ ПРОВОД 🔌</b><span>и не слушать</span></div></div>
    <div class="bdg" id="b5a" style="top:930px;background:#fff;color:#111">💬 ПИШИ ЦИФРУ В КОММЕНТЫ</div>
    <div class="bdg" id="b5b" style="top:1060px;background:#c8242f;color:#fff">СЕРИЯ 7 — РЕШАЕШЬ ТЫ</div></div>
  <div class="scene" id="s6"></div>
</div></div></div>
<script src="../../survival/engine.js"></script>
<script src="../common.js"></script>
<script src="../zap.js"></script>
<script>
"use strict";
const DUR = 29.3;
// Растяжка таймлайна под озвучку: пары [время сценария, время видео]. Строку генерирует tools/make-voice.py
const WARP = [[0, 0.00], [0.1, 0.10], [2.4, 3.55], [4, 7.03], [5.2, 8.61], [6.6, 10.30], [7.6, 11.58], [9.4, 13.00], [11.6, 15.17], [13.2, 17.09], [14.4, 18.68], [15.6, 20.31], [17.8, 22.68], [19.2, 24.69], [20, 25.97], [21, 27.33], [22.2, 28.75], [23.6, 30.86], [25.4, 33.05], [29, 35.30], [29.3, 35.60]];
const SCENES = [{ id: "s1", s: 0, e: 4.0 }, { id: "s2", s: 4.0, e: 9.4 }, { id: "s3", s: 9.4, e: 14.4 }, { id: "s4", s: 14.4, e: 21.0 }, { id: "s5", s: 21.0, e: 29.0 }, { id: "s6", s: 29.0, e: 29.3 }];
const SPEAK = [];
const DROP = ["подписывайся"];
const SHAKES = [15.6], FLASHES = [];
const clockText = (t) => (t >= 4.0 && t < 21.0 ? "ПРАВИЛА НОЧНОГО СТОРОЖА · СЕРИЯ 6" : null);
const CAPS = [
  [0.1, "В прошлой серии {y:я нашёл своё имя в списке сторожей.}"], [2.4, "Вы выбрали: {y:позвонить по номеру на обложке.}"],
  [4, "Я набрал номер."], [5.2, "Длинные гудки."], [6.6, "Щелчок."], [7.6, "{r:Тишина.}"],
  [9.4, "А потом в трубке {r:заговорил мой голос:}"], [11.6, "{r:не спускайся в подвал.}"], [13.2, "{r:Не спускайся.}"],
  [14.4, "Я бросил трубку."], [15.6, "И тут {r:зазвонил телефон на вахте.}"], [17.8, "На табло высветился номер."], [19.2, "Внутренний."], [20, "{r:Подвал.}"],
  [21, "Что мне делать?"], [22.2, "{y:Один} — ответить."], [23.6, "{y:Два} — выдернуть провод."], [25.4, "Пиши {y:цифру} в комменты."], [29, ""]
];
const MUSIC = { bpm: 60, root: 41, parts: [[0, 21.0, "pad", .6], [21.0, 29.3, "pad", .35]] };
const phone = (id, lcd) => `<g id="${id}"><path d="M-260 140 L-200 -60 L200 -60 L260 140Z" fill="#2a2a30" stroke="${OL}" stroke-width="10"/>
  <g class="hs"><path d="M-250 -70 Q-260 -150 -170 -150 L170 -150 Q260 -150 250 -70 L180 -70 Q170 -110 120 -110 L-120 -110 Q-170 -110 -180 -70Z" fill="#1c1c22" stroke="${OL}" stroke-width="10"/></g>
  <rect x="-130" y="-30" width="260" height="70" rx="8" fill="#1a3a2a" stroke="${OL}" stroke-width="6"/><text class="lcd" y="16" font-family="JetBrains Mono" font-weight="800" font-size="34" text-anchor="middle" fill="#6aff9a">${lcd}</text>
  ${[0, 1, 2].map((r) => [0, 1, 2].map((c) => `<rect x="${-75 + c * 55}" y="${55 + r * 26}" width="40" height="18" rx="5" fill="#55555f"/>`).join("")).join("")}</g>`;
const handset = (id) => `<g id="${id}"><path d="M-300 -60 Q-320 -160 -220 -170 L220 -170 Q320 -160 300 -60 L220 -60 Q200 -110 150 -110 L-150 -110 Q-200 -110 -220 -60Z" fill="#1c1c22" stroke="#555" stroke-width="10"/>
  ${[0, 1, 2, 3, 4].map((i) => `<circle cx="${-260 + (i % 3) * 22}" cy="${-110 + Math.floor(i / 3) * 22}" r="7" fill="#444"/>`).join("")}</g>`;
function build() {
  $("#a1").innerHTML = DEFS + journal("j1") + `<rect width="1080" height="1920" fill="url(#gTorch)"/>`;
  $("#a2").innerHTML = DEFS + `<rect width="1080" height="1920" fill="#0b0d14"/><rect y="1100" width="1080" height="820" fill="#3a2c22"/>` + `<g transform="translate(540 1000) scale(1.5)">${phone("ph2", "_ _ _ _ _")}</g><rect width="1080" height="1920" fill="url(#gVig)"/>`;
  $("#a3").innerHTML = DEFS + `<rect width="1080" height="1920" fill="#06070b"/><g id="wv3" fill="none" stroke="#ff3b47" stroke-width="8"></g><g transform="translate(540 1000) rotate(-20) scale(1.6)">${handset("hd3")}</g><rect width="1080" height="1920" fill="url(#gVig)"/>`;
  $("#a4").innerHTML = DEFS + `<rect width="1080" height="1920" fill="#0b0d14"/><rect y="1100" width="1080" height="820" fill="#3a2c22"/><g id="rg4" fill="none" stroke="#ffd23f" stroke-width="10"></g>` + `<g id="pw4"><g transform="scale(1.5)">${phone("ph4", "ВНУТР · ПОДВАЛ")}</g></g><rect width="1080" height="1920" fill="url(#gVig)"/>`;
  $("#a5").innerHTML = DEFS + `<g filter="url(#fBlur)"><rect width="1080" height="1920" fill="#0b0d14"/><g transform="translate(540 1000) scale(1.5)">${phone("ph5", "ВНУТР · ПОДВАЛ")}</g></g><rect width="1080" height="1920" fill="#05060a" opacity=".6"/>`;
}
const zoom = (sel, k, ox = 540, oy = 960) => { const e = $(sel); e.style.transformOrigin = `${ox}px ${oy}px`; e.style.transform = `scale(${k})`; };
const U = {
  s1(lt, t) { zoom("#a1", 1 + .03 * t, 540, 900); const h = $("#h1"); h.style.opacity = 1; h.style.transform = `scale(${1 + .02 * Math.sin(t * 5)})`; },
  s2(lt, t) { zoom("#a2", 1 + .05 * lt, 540, 1000); const n = "8 0 1 7 4 4 1 0 4", k = Math.min(n.length, Math.floor(prog(t, 4.2, 5.2) * n.length)); $("#ph2 .lcd").textContent = n.slice(0, k) || "_ _ _ _";
    $("#ph2 .hs").setAttribute("transform", `translate(0 ${t > 4.2 ? -30 : 0})`); },
  s3(lt, t) { zoom("#a3", 1 + .08 * lt, 540, 1000); const on = t > 9.6; $("#wv3").innerHTML = on ? [0, 1, 2, 3].map((i) => { const q = (t * .9 + i / 4) % 1; return `<circle cx="300" cy="830" r="${60 + q * 400}" opacity="${(1 - q) * .8}"/>`; }).join("") : "";
    const s = $("#sy3"); s.style.opacity = prog(t, 11.6, 12.0); s.style.transform = `translate(${t > 13.2 ? 6 * Math.sin(t * 40) : 0}px,0)`; },
  s4(lt, t) { const ring = t > 15.6, sh = ring ? 10 * Math.sin(t * 50) : 0; $("#pw4").setAttribute("transform", `translate(${540 + sh} ${1000 - (ring ? Math.abs(6 * Math.sin(t * 25)) : 0)})`);
    $("#ph4 .hs").setAttribute("transform", `translate(0 ${ring ? -8 * Math.abs(Math.sin(t * 25)) : 0})`); $("#ph4 .lcd").setAttribute("opacity", t > 17.8 ? (Math.sin(t * 8) > -.3 ? 1 : .3) : 0);
    $("#ph4 .lcd").setAttribute("fill", t > 20.0 ? "#ff3b47" : "#6aff9a"); zoom("#a4", 1 + .25 * prog(t, 17.8, 20.8), 540, 1000);
    $("#rg4").innerHTML = ring ? [0, 1, 2].map((i) => { const q = (t * 1.5 + i / 3) % 1; return `<path d="M${540 - 260 - q * 120} ${820 - q * 80} q-40 60 0 120 M${540 + 260 + q * 120} ${820 - q * 80} q40 60 0 120" opacity="${1 - q}"/>`; }).join("") : ""; },
  s5(lt, t) { show($("#q5"), t, 21.05); show($("#c5a"), t, 22.2, .3, 60); show($("#c5b"), t, 23.6, .3, 60); show($("#b5a"), t, 25.4); show($("#b5b"), t, 26.6);
    if (t < 22.2) $("#c5a").style.opacity = 0; if (t < 23.6) $("#c5b").style.opacity = 0; if (t < 25.4) $("#b5a").style.opacity = 0; if (t < 26.6) $("#b5b").style.opacity = 0; },
  s6(lt, t) { const s = $("#s5"); s.style.display = "block"; s.style.opacity = 1; U.s5(0, t); },
};
const UPD = {}; SCENES.forEach(({ id }) => { UPD[id] = (lt, t) => U[id](lt, t); });
function SOUND(sfx, add) {
  for (let i = 0; i < 9; i++) add(4.2 + i * .11, (a) => sfx.osc("sine", [941, 1336, 1209, 1477, 1209, 1336, 1209, 1336, 1209][i], a, .005, .05, .08));
  [5.3, 5.95].forEach((x) => add(x, (a) => sfx.osc("sine", 425, a, .01, .06, .5))); add(6.6, (a) => sfx.noise(a, .06, "highpass", 2500, 1, .3, .002));
  add(9.6, (a) => sfx.noise(a, 4.6, "bandpass", 600, 1, .08, .4)); add(11.6, sfx.boom); add(13.2, sfx.hit); add(14.4, (a) => sfx.noise(a, .1, "lowpass", 400, 1, .5, .01));
  for (let x = 15.6; x < 21; x += 1.2) { add(x, (a) => sfx.osc("square", 880, a, .01, .05, .35)); add(x + .12, (a) => sfx.osc("square", 660, a, .01, .05, .35)); } add(20.0, sfx.boom);
  [22.2, 23.6].forEach((t) => add(t, sfx.ding)); [25.4, 26.6].forEach((t) => add(t, sfx.pop));
}
ENGINE.start();
</script>
</body>
</html>
