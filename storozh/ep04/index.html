<script>
"use strict";
const DUR = 37.3;
// Растяжка таймлайна под озвучку: пары [время сценария, время видео]. Строку генерирует tools/make-voice.py
const WARP = [[0, 0], [37.3, 37.3]];
const SCENES = [
  { id: "s1", s: 0, e: 4.6 }, { id: "s2", s: 4.6, e: 9.6 }, { id: "s3", s: 9.6, e: 16.4 }, { id: "s4", s: 16.4, e: 20.6 },
  { id: "s5", s: 20.6, e: 28.6 }, { id: "s6", s: 28.6, e: 37.0 }, { id: "s7", s: 37.0, e: 37.3 },
];
const SPEAK = [];
const DROP = ["подписывайся"];
const SHAKES = [11.0, 27.0];
const FLASHES = [];
const clockText = (t) => (t >= 4.6 && t < 28.6 ? "ПРАВИЛА НОЧНОГО СТОРОЖА · СЕРИЯ 4" : null);
const CAPS = [
  [0.1, "Вы выбрали: {y:бежать к подвалу.}"],
  [2.0, "Я схватил ключ с подоконника {y:и побежал по тёмному коридору.}"],
  [4.6, "Шаги гулко отдавались от стен,"],
  [6.4, "и мне казалось, что {r:за мной бежит кто-то ещё.}"],
  [9.6, "Дверь подвала {r:была открыта.}"],
  [11.0, "Совсем чуть-чуть, на ладонь."],
  [12.6, "Из щели тянуло холодом и сыростью."],
  [14.6, "{r:Я точно помню, как запирал её.}"],
  [16.4, "Снизу кто-то {r:тихо напевал колыбельную.}"],
  [18.6, "Ту самую, которую пела мне мама."],
  [20.6, "Я посветил на дверь."],
  [21.8, "С внутренней стороны мелом было написано:"],
  [24.0, "{r:«Правило номер ноль. Не спускайся».}"],
  [26.0, "Такого правила не было в списке."],
  [27.4, "{r:А почерк… был мой.}"],
  [28.6, "Что мне делать?"],
  [29.8, "{y:Один} — спуститься в подвал."],
  [31.4, "{y:Два} — запереть дверь и дочитать журнал прошлого сторожа."],
  [34.4, "Пиши {y:цифру} в комменты."],
  [35.8, "Решать тебе."],
  [37.0, ""]
];
const MUSIC = { bpm: 60, root: 41, parts: [[0, 28.6, "pad", .6], [28.6, 37.3, "pad", .35]] };
const FL2 = [[5.2, 5.32, 12.5], [6.8, 6.95, 9.5], [8.0, 8.15, 6.5], [9.0, 9.2, 4.0]];
function build() {
  const guard = (id) => `<g transform="translate(420 2060) scale(1.25)">${personBack(id, { label: "ОХРАНА", torch: 1 })}</g>`;
  $("#a1").innerHTML = DEFS + nightWin("w1", 140, 200, 800, 760) + `<rect x="100" y="960" width="880" height="80" fill="#c9c2a8" stroke="${OL}" stroke-width="10"/>
    <g id="hn1"><ellipse rx="70" ry="54" fill="${SKIN2}" stroke="${OL}" stroke-width="8"/><rect x="30" y="-30" width="300" height="70" rx="20" fill="${COAT}" stroke="${OL}" stroke-width="8"/></g>
    <g id="k1" transform="translate(540 968) rotate(-80)"><rect x="-8" y="-150" width="16" height="140" fill="#d9c25a" stroke="${OL}" stroke-width="5"/><circle cy="20" r="34" fill="none" stroke="#d9c25a" stroke-width="14"/></g><rect width="1080" height="1920" fill="url(#gVig)"/>`;
  $("#a2").innerHTML = DEFS + corridor("c2") + `<g id="fg2"></g><rect id="dk2" width="1080" height="1920" fill="#000" opacity=".6"/><rect width="1080" height="1920" fill="url(#gVig)"/><g id="w2">${guardFront("gf2", "f2", { free: 1 })}</g>`;
  $("#a3").innerHTML = DEFS + cellarDoor("x3") + `<g id="fm3" fill="#cfd8e8" opacity=".5"></g>`;
  $("#a4").innerHTML = DEFS + `<rect width="1080" height="1920" fill="#05060a"/>${Array.from({ length: 8 }, (_, i) => `<rect x="${300 - i * 10}" y="${700 + i * 120}" width="${480 + i * 20}" height="30" fill="#14161c" opacity="${1 - i * .1}"/>`).join("")}<g id="nt4" font-size="90" fill="#bfc8e0"></g><rect width="1080" height="1920" fill="url(#gVig)"/>`;
  $("#a5").innerHTML = DEFS + `<rect width="1080" height="1920" fill="#2a1f1a"/>${[0, 1, 2].map((i) => `<rect x="140" y="${300 + i * 420}" width="800" height="360" fill="none" stroke="#1f1612" stroke-width="12"/>`).join("")}
    <ellipse id="sp5" cx="540" cy="760" rx="420" ry="420" fill="#fff4cc" opacity=".14" style="mix-blend-mode:screen"/><rect width="1080" height="1920" fill="url(#gTorch)"/>`;
  $("#a6").innerHTML = DEFS + `<g filter="url(#fBlur)">${cellarDoor("x6")}</g><rect width="1080" height="1920" fill="#05060a" opacity=".6"/>`;
  $("#c2F").setAttribute("opacity", 0);
}
const zoom = (sel, k, ox = 540, oy = 760) => { const e = $(sel); e.style.transformOrigin = `${ox}px ${oy}px`; e.style.transform = `scale(${k})`; };
const ajar = (id, k) => $(`#${id}D`).setAttribute("transform", `translate(300 0) scale(${1 - .18 * k} 1) translate(-300 0)`);
const U = {
  s1(lt, t) {
    zoom("#a1", 1.3 + .02 * t, 540, 960); const g = easeInOut(prog(t, 1.8, 2.8));
    $("#hn1").setAttribute("transform", `translate(${lerp(980, 600, g)} ${lerp(900, 960, g)})`); $("#k1").setAttribute("opacity", t > 3.0 ? 0 : 1); $("#w1S").setAttribute("transform", "translate(470 960) scale(1.4)");
    const h = $("#h1"); h.style.opacity = 1; h.style.transform = `scale(${1 + .02 * Math.sin(t * 5)})`;
  },
  s2(lt, t) {
    const k = prog(t, 4.6, 9.6); $("#w2").setAttribute("transform", `translate(${540 + 14 * Math.sin(t * 11)} ${lerp(1300, 1900, k) - Math.abs(Math.sin(t * 11)) * 16}) scale(${lerp(.6, 1.1, k)})`);
    setFace("f2", "fear", Math.sin(t * 3)); const w = FL2.find(([a, b]) => t >= a && t < b); $("#c2L").setAttribute("opacity", w ? 1 : 0); $("#dk2").setAttribute("opacity", w ? .15 : .6); $("#fg2").innerHTML = w ? figure(-.2, w[2]) : "";
  },
  s3(lt, t) {
    zoom("#a3", lerp(1, 1.25, prog(t, 9.6, 16.4)), 700, 800); ajar("x3", 1); $("#x3K").setAttribute("opacity", 0);
    $("#fm3").innerHTML = Array.from({ length: 6 }, (_, i) => { const q = (t * .4 + i / 6) % 1; return `<ellipse cx="${(720 + 40 * Math.sin(i + t)).toFixed(0)}" cy="${(1100 - q * 600).toFixed(0)}" rx="${(30 + 60 * q).toFixed(0)}" ry="${(14 + 20 * q).toFixed(0)}" opacity="${(1 - q).toFixed(2)}"/>`; }).join("");
  },
  s4(lt, t) { zoom("#a4", 1 + .05 * lt, 540, 900); $("#nt4").innerHTML = [0, 1, 2, 3].map((i) => { const q = (t * .3 + i / 4) % 1; return `<text x="${(440 + 160 * Math.sin(i * 2 + t * .8)).toFixed(0)}" y="${(1500 - q * 900).toFixed(0)}" opacity="${Math.sin(q * Math.PI).toFixed(2)}">${i % 2 ? "♪" : "♫"}</text>`; }).join(""); },
  s5(lt, t) { $("#sp5").setAttribute("cx", 540 + 40 * Math.sin(t * 2)); const c = $("#ch5"); c.style.opacity = prog(t, 22.0, 24.0); c.style.color = t > 27.4 ? "#ff8a8a" : "#f4f1e6"; zoom("#a5", 1 + .04 * lt); },
  s6(lt, t) {
    ajar("x6", 1); show($("#q6"), t, 28.65); show($("#c6a"), t, 29.8, .3, 60); show($("#c6b"), t, 31.4, .3, 60); show($("#b6a"), t, 34.4); show($("#b6b"), t, 35.8);
    if (t < 29.8) $("#c6a").style.opacity = 0; if (t < 31.4) $("#c6b").style.opacity = 0; if (t < 34.4) $("#b6a").style.opacity = 0; if (t < 35.8) $("#b6b").style.opacity = 0;
  },
  s7(lt, t) { const s = $("#s6"); s.style.display = "block"; s.style.opacity = 1; U.s6(0, t); },
};
const UPD = {}; SCENES.forEach(({ id }) => { UPD[id] = (lt, t) => U[id](lt, t); });
function SOUND(sfx, add) {
  const step = (a, v = .32) => sfx.noise(a, .07, "lowpass", 260, 1, v, .005), buzz = (a) => sfx.noise(a, .07, "highpass", 2500, 1, .12, .002);
  add(2.2, (a) => sfx.noise(a, .1, "highpass", 2000, 2, .3, .005)); for (let t = 4.7; t < 9.6; t += .3) { add(t, (a) => step(a)); if (t > 6.4) add(t + .15, (a) => step(a, .2)); }
  FL2.forEach(([a]) => add(a, buzz)); add(9.7, (a) => sfx.noise(a, 1.2, "lowpass", 300, 1, .3, .3, 120)); add(11.0, sfx.hit); add(12.6, (a) => sfx.wind(a, 3.6, .5));
  for (let i = 0; i < 6; i++) add(16.6 + i * .6, (a) => sfx.osc("sine", [392, 349, 330, 294, 330, 262][i], a, .08, .05, .55));
  add(21.0, (a) => sfx.noise(a, .05, "highpass", 1500, 1, .3, .002)); add(24.0, (a) => sfx.riser(a, 1.5)); add(27.4, sfx.boom); add(27.4, sfx.hit);
  [29.8, 31.4].forEach((t) => add(t, sfx.ding)); [34.4, 35.8].forEach((t) => add(t, sfx.pop));
}
ENGINE.start();
</script>
