    $("#d" + k + "D").setAttribute("transform", z.knock && lt >= z.knock ? `translate(${4 * Math.sin(t * 50)} 0)` : ""); }
  if (z.t === "exterior") { const w = $("#x" + k + "W"); if (w) w.setAttribute("opacity", z.win !== undefined && lt >= z.win ? 1 : 0); }
