<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Записки прошлого сторожа №4 — Палата 14</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=JetBrains+Mono:wght@700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../survival/engine.css">
</head>
<body>
<div id="wrap"><div id="stage"><div id="cam">
  <div class="scene" id="s1"><svg class="full" width="1080" height="1920" viewBox="0 0 1080 1920" id="a1"></svg>
    <div class="ep">ЗАПИСКИ ПРОШЛОГО СТОРОЖА · №4</div><div class="ttl" id="h1" style="top:170px">ПРАВИЛО №7:<br><i>ЕСЛИ В ПАЛАТЕ 14 ГОРИТ СВЕТ…</i></div></div>
  <div class="scene" id="s2"><svg class="full" width="1080" height="1920" viewBox="0 0 1080 1920" id="a2"></svg></div>
  <div class="scene" id="s3"><svg class="full" width="1080" height="1920" viewBox="0 0 1080 1920" id="a3"></svg></div>
  <div class="scene" id="s4"><svg class="full" width="1080" height="1920" viewBox="0 0 1080 1920" id="a4"></svg></div>
  <div class="scene" id="s5"><svg class="full" width="1080" height="1920" viewBox="0 0 1080 1920" id="a5"></svg>
    <div class="hand" id="t5">…горит свет —</div>
    <div class="ttl" id="q5" style="top:1000px;font-size:66px">ТЫ БЫ ОТКРЫЛ<br><i>ЭТУ ДВЕРЬ?</i></div>
    <div class="bdg" id="b5" style="top:1180px;background:#fff;color:#111">💬 ПИШИ В КОММЕНТЫ</div></div>
  <div class="scene" id="s6"></div>
</div></div></div>
<script src="../../survival/engine.js"></script>
<script src="../common.js"></script>
<script src="../zap.js"></script>
<script>
"use strict";
const DUR = 27.5;
// Растяжка таймлайна под озвучку: пары [время сценария, время видео]. Строку генерирует tools/make-voice.py
const WARP = [[0, 0], [27.5, 27.5]];
const SCENES = [{ id: "s1", s: 0, e: 4.4 }, { id: "s2", s: 4.4, e: 10.2 }, { id: "s3", s: 10.2, e: 16.6 }, { id: "s4", s: 16.6, e: 21.6 }, { id: "s5", s: 21.6, e: 27.2 }, { id: "s6", s: 27.2, e: 27.5 }];
const SPEAK = [];
const DROP = ["подписывайся"];
const SHAKES = [19.6], FLASHES = [];
const clockText = (t) => (t >= 4.4 && t < 21.6 ? "ЗАПИСКИ ПРОШЛОГО СТОРОЖА · №4" : null);
const CAPS = [
  [0.1, "Ещё одна запись {y:из журнала.}"],
  [1.8, "«Правило седьмое оборвано на полуслове:"], [3.4, "{r:если в палате четырнадцать горит свет…}"],
  [4.4, "{r:Сегодня он горел.}"], [5.6, "Палата заперта уже тридцать лет,"], [7.4, "ключа нет ни у кого."], [8.6, "Я заглянул в щель под дверью."],
  [10.2, "Свет был тёплый, {y:как от ночника.}"], [11.8, "И там {r:кто-то сидел на кровати и раскачивался.}"],
  [16.6, "А потом свет погас."], [18.0, "И с той стороны {r:в щель под дверью посмотрел глаз.»}"],
  [21.6, "Дальше правило так и не дописано."], [23.4, "А ты бы открыл эту дверь?"], [25.0, "Пиши в комменты."], [27.2, ""]
];
const MUSIC = { bpm: 60, root: 41, parts: [[0, 27.5, "pad", .6]] };
const door = (id) => `<rect width="1080" height="1920" fill="#232a36"/><rect y="1180" width="1080" height="740" fill="#1c1e26"/><rect y="760" width="1080" height="420" fill="#17332c"/>
  <g stroke="${OL}" stroke-width="8"><rect x="300" y="420" width="480" height="760" fill="#3a2c26"/>${[0, 1].map((i) => `<rect x="340" y="${480 + i * 340}" width="400" height="280" fill="none" stroke="#2a1f1a" stroke-width="8"/>`).join("")}<rect x="690" y="760" width="50" height="90" rx="8" fill="#8a7a5a"/>
  <rect x="440" y="340" width="200" height="70" rx="8" fill="#c9c2a8"/><text x="540" y="392" font-family="Montserrat" font-weight="900" font-size="48" text-anchor="middle" fill="#3a2a20" stroke="none">14</text></g>
  <rect id="${id}G" x="300" y="1176" width="480" height="10" fill="#ffd27a" opacity="0"/><ellipse id="${id}H" cx="540" cy="1200" rx="320" ry="60" fill="#ffd27a" opacity="0"/><rect width="1080" height="1920" fill="url(#gVig)"/>`;
function build() {
  $("#a1").innerHTML = DEFS + journal("j1");
  $("#a2").innerHTML = DEFS + door("d2");
  $("#a3").innerHTML = DEFS + `<rect width="1080" height="1920" fill="#0b0d14"/><g id="rm3"><rect x="0" y="540" width="1080" height="560" fill="#3a2a1a"/>
    <rect x="200" y="880" width="680" height="120" fill="#e8e0c8" stroke="${OL}" stroke-width="6"/><rect x="180" y="840" width="40" height="200" fill="#6a5a4a"/><rect x="860" y="840" width="40" height="200" fill="#6a5a4a"/>
    <g id="fg3"><path d="M480 880 V700 Q480 640 540 640 Q600 640 600 700 V880Z" fill="#050505"/><circle cx="540" cy="610" r="54" fill="#050505"/></g><ellipse cx="820" cy="760" rx="50" ry="40" fill="#ffd27a" opacity=".8"/></g>
    <rect x="0" y="0" width="1080" height="540" fill="#0b0d14"/><rect x="0" y="1100" width="1080" height="820" fill="#0b0d14"/><rect width="1080" height="1920" fill="url(#gVig)"/>`;
  $("#a4").innerHTML = DEFS + `<rect width="1080" height="1920" fill="#050608"/><rect x="0" y="880" width="1080" height="160" fill="#0a0a0c"/><g id="ey4" opacity="0" transform="translate(540 960)"><ellipse rx="220" ry="70" fill="#e8e0d0"/><circle r="60" fill="#3a2a1a"/><circle r="26" fill="#000"/><circle cx="-18" cy="-18" r="10" fill="#fff"/></g><rect width="1080" height="1920" fill="url(#gVig)"/>`;
  $("#a5").innerHTML = DEFS + torn;
}
const zoom = (sel, k, ox = 540, oy = 760) => { const e = $(sel); e.style.transformOrigin = `${ox}px ${oy}px`; e.style.transform = `scale(${k})`; };
const U = {
  s1(lt, t) { zoom("#a1", 1 + .03 * t, 540, 900); const h = $("#h1"); h.style.opacity = 1; h.style.transform = `scale(${1 + .02 * Math.sin(t * 5)})`; },
  s2(lt, t) { zoom("#a2", lerp(1, 1.5, prog(t, 4.4, 10.2)), 540, 1180); const on = t > 4.6; $("#d2G").setAttribute("opacity", on ? .9 : 0); $("#d2H").setAttribute("opacity", on ? .25 + .05 * Math.sin(t * 3) : 0); },
  s3(lt, t) { $("#fg3").setAttribute("transform", `rotate(${t > 11.8 ? 8 * Math.sin(t * 3) : 0} 540 880)`); $("#fg3").setAttribute("opacity", t > 11.8 ? 1 : 0); zoom("#a3", 1 + .04 * lt, 540, 900); },
  s4(lt, t) { $("#ey4").setAttribute("opacity", prog(t, 18.6, 19.4)); $("#ey4").setAttribute("transform", `translate(${540 + 20 * Math.sin(t * 2)} 960) scale(1 ${t > 20.4 && t < 20.55 ? .1 : 1})`); zoom("#a4", 1 + .1 * lt, 540, 960); },
  s5(lt, t) { show($("#t5"), t, 21.65); show($("#q5"), t, 23.4); if (t < 23.4) $("#q5").style.opacity = 0; show($("#b5"), t, 25.0); if (t < 25.0) $("#b5").style.opacity = 0; },
  s6(lt, t) { const s = $("#s5"); s.style.display = "block"; s.style.opacity = 1; U.s5(0, t); },
};
const UPD = {}; SCENES.forEach(({ id }) => { UPD[id] = (lt, t) => U[id](lt, t); });
function SOUND(sfx, add) {
  add(.2, (a) => sfx.noise(a, .4, "highpass", 3000, 1, .1, .05)); add(4.6, (a) => sfx.noise(a, .06, "highpass", 2500, 1, .2, .002));
  for (let t = 11.9; t < 16.6; t += .9) add(t, (a) => sfx.noise(a, .3, "lowpass", 260, 2, .2, .05)); add(16.7, (a) => sfx.noise(a, .05, "highpass", 2500, 1, .3, .002));
  for (let t = 17.0; t < 21.6; t += .55) add(t, (a) => sfx.heart(a, .8)); add(19.6, sfx.boom); add(19.6, sfx.hit); add(21.6, (a) => sfx.noise(a, .5, "highpass", 2000, 1, .3, .01, 600)); add(23.4, sfx.ding);
}
ENGINE.start();
</script>
</body>
